<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rotzx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=0.12.3">
  <script>
    try { const t = localStorage.getItem("econatlas-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="wordmark" href="#/">rotzx</a>
      <nav class="nav" id="nav" aria-label="Módulos">
        <a href="#/radar" data-mod="radar">Radar Brasil</a>
        <a href="#/forecast" data-mod="forecast">MacroForecast</a>
        <a href="#/setorial" data-mod="setorial">Radar Setorial</a>
        <a href="#/mundo" data-mod="mundo">Brasil x Mundo</a>
      </nav>
      <div class="tools">
        <span class="stamp" id="stamp"></span>
        <a href="#/qualidade" data-mod="qualidade">Qualidade</a>
        <button class="theme-btn" id="theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="app" class="wrap"></main>
  <footer class="foot wrap">
    rotzx, protótipo 0.12. Dados de fontes públicas oficiais (Banco Central do Brasil e IBGE), citados em cada indicador.
    Previsões e indicadores experimentais não constituem recomendação de investimento.
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script src="/static/app.js?v=0.12.3"></script>
</body>
</html>
