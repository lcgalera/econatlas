<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rotzx — Como o Brasil se conecta ao mundo</title>
<meta name="description" content="Explore os parceiros comerciais do Brasil, descubra o que compramos e vendemos e acompanhe como essas relações mudaram desde 1997.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  /* rotzx — atlas das relações comerciais do Brasil (D47). Tema escuro sóbrio, linhas finas, um acento verde. */
  :root {
    --bg: #090d12; --frame: #0c1219; --pane: #0e151d; --rule: rgba(255,255,255,.08); --rule-2: rgba(255,255,255,.16);
    --ink: #e7ecea; --ink-2: #b7c0c2; --muted: #8a959b; --accent: #8fd3b6; --accent-2: #5fae8e; --warn: #e0b45c;
    --exp: #8fd3b6; --imp: #9ccbea; --neg: #e2947f; --chip: rgba(255,255,255,.05);
    --sel: rgba(240,248,244,.62); --stroke: rgba(205,236,226,.28); --base: rgba(143,211,182,.62);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .kicker { font: 500 11px/1.2 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* bandeiras: tamanho fixo (não desloca o layout ao carregar); sem bandeira, um retângulo discreto */
  .flag { display: inline-block; width: 20px; height: 15px; flex: none; border-radius: 2px; object-fit: cover; vertical-align: -2px;
          background: rgba(255,255,255,.06); box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .flag.g { width: 36px; height: 27px; border-radius: 3px; vertical-align: -5px; }
  .flag.vazia { background: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 3px, rgba(255,255,255,.02) 3px 6px); }

  /* barra de cima */
  .barra { display: flex; align-items: center; gap: 20px; padding: 12px 28px; border-bottom: 1px solid var(--rule); }
  .marca { font: 600 20px/1 "Source Serif 4", Georgia, serif; text-decoration: none; white-space: nowrap; }
  .marca span { font: 400 14px/1 "IBM Plex Sans", sans-serif; color: var(--ink-2); margin-left: 10px; }
  .barra .fontes-link { margin-left: auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* busca com sugestões (bandeira + nome) */
  .ac { position: relative; }
  .ac input { width: 260px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--rule-2); background: rgba(255,255,255,.02); font-size: 14px; outline: none; }
  .ac input::placeholder { color: var(--muted); }
  .ac input:focus { border-color: var(--accent-2); }
  .ac ul { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; min-width: 260px; max-height: 320px; overflow-y: auto; margin: 0; padding: 4px;
           list-style: none; background: #111a23; border: 1px solid var(--rule-2); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  .ac li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .ac li[aria-selected="true"], .ac li:hover { background: rgba(143,211,182,.12); }
  .ac li small { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* quadro: mapa à esquerda, conteúdo à direita */
  .quadro { margin: 16px 28px 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); height: max(640px, calc(100vh - 96px));
            border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--frame); }
  .lado-mapa { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); }
  .mapa-topo { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
  .modos { display: flex; padding: 3px; border: 1px solid var(--rule-2); border-radius: 7px; }
  .modos button { border: 0; background: transparent; padding: 5px 12px; border-radius: 5px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .modos button[aria-pressed="true"] { background: rgba(255,255,255,.09); color: var(--ink); }
  .voltar { display: none; align-items: center; gap: 8px; margin-left: auto; padding: 6px 12px; border: 1px solid var(--rule-2); border-radius: 6px; background: transparent; cursor: pointer; font-size: 14px; }
  body.com-pais .voltar, body.com-vista .voltar { display: inline-flex; }
  .area { position: relative; flex: 1; min-height: 0; background: radial-gradient(ellipse at 50% 46%, #122130 0%, var(--frame) 64%); }
  #globo { position: absolute; inset: 0; }
  .zoom { position: absolute; right: 14px; top: 14px; z-index: 3; display: grid; border: 1px solid var(--rule-2); border-radius: 7px; overflow: hidden; background: rgba(9,13,18,.6); }
  .zoom button { width: 36px; height: 34px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--ink-2); }
  .zoom button + button { border-top: 1px solid var(--rule-2); }
  .lista { position: absolute; inset: 0; z-index: 2; display: none; overflow-y: auto; padding: 14px 18px; background: var(--frame); }
  body.modo-lista .lista { display: block; }
  body.modo-lista .zoom { display: none; }
  .aviso-3d { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: 6px; font-size: 13.5px; color: var(--ink-2); }
  .tip { background: rgba(9,13,18,.95); border: 1px solid var(--rule-2); padding: 7px 10px; border-radius: 5px; font: 13px/1.4 "IBM Plex Sans", sans-serif; color: var(--ink); }
  .tip b { font-weight: 500; } .tip span { display: block; color: var(--ink-2); font-size: 12.5px; }

  /* controles: métrica, ano, legenda — fora do 3D, funcionam com a lista também */
  .controles { padding: 12px 18px 14px; border-top: 1px solid var(--rule); display: grid; gap: 9px; }
  .metricas { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .metricas button { border: 1px solid var(--rule-2); background: transparent; padding: 5px 10px; border-radius: 5px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .metricas button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .metricas .sep { color: var(--muted); font-size: 12px; margin: 0 4px 0 8px; }
  .ano-linha { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; }
  .ano-linha button { width: 34px; height: 32px; border: 1px solid var(--rule-2); border-radius: 5px; background: transparent; cursor: pointer; font-size: 12px; }
  .ano-linha input[type=range] { width: 100%; accent-color: var(--accent); }
  .ano-linha output { font: 500 24px/1 "Source Serif 4", Georgia, serif; min-width: 3.2em; text-align: right; }
  .anos-chips { display: flex; gap: 6px; }
  .anos-chips button { border: 1px solid var(--rule-2); background: transparent; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .anos-chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .leg { font-size: 12px; color: var(--ink-2); display: grid; gap: 5px; }
  .leg .grad { height: 7px; border-radius: 4px; }
  .leg .ext { display: flex; justify-content: space-between; color: var(--muted); }
  .leg .cats { display: flex; flex-wrap: wrap; gap: 12px; }
  .leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .leg .aviso { color: var(--warn); }

  /* coluna de texto */
  .lado-texto { background: var(--pane); overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .sec { padding: 22px 30px; border-bottom: 1px solid var(--rule); }
  .sec:last-child { border-bottom: 0; }
  .sec h2 { font: 500 34px/1.12 "Source Serif 4", Georgia, serif; margin: 8px 0 8px; letter-spacing: -.01em; }
  .sec h3 { font: 500 20px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
  .lead { color: var(--ink-2); font-size: 15.5px; margin: 0; max-width: 60ch; }
  .fonte { font-size: 12.5px; color: var(--muted); margin: 4px 0 12px; }
  .fonte a { color: inherit; }
  .nota { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin: 10px 0; }
  .kpi { background: var(--pane); padding: 11px 13px; min-width: 0; }
  .kpi span { display: block; font-size: 12px; color: var(--muted); }
  .kpi b { display: block; margin-top: 2px; font: 500 20px/1.25 "Source Serif 4", Georgia, serif; }
  .kpi small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .perguntas { display: grid; gap: 8px; margin-top: 12px; }
  .perguntas button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 14px; border: 1px solid var(--rule-2); border-radius: 7px; background: rgba(255,255,255,.015); cursor: pointer; font-size: 14.5px; }
  .perguntas button:hover { border-color: var(--accent-2); background: rgba(143,211,182,.06); }
  .perguntas button::after { content: "→"; margin-left: auto; color: var(--muted); }
  .rank { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: r; }
  .rank li { border-bottom: 1px solid var(--rule); }
  .rank button { width: 100%; display: grid; grid-template-columns: 28px 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 2px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 14px; position: relative; }
  .rank button:hover .nome { color: var(--accent); }
  .rank .pos { color: var(--muted); font-size: 12.5px; text-align: right; }
  .rank .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .val { text-align: right; white-space: nowrap; color: var(--ink-2); }
  .rank .val small { display: block; color: var(--muted); font-size: 12px; }
  .rank .barra-v { position: absolute; left: 60px; bottom: 3px; height: 2px; background: var(--accent-2); border-radius: 1px; opacity: .7; }
  .rank .barra-v.neg { background: var(--neg); }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { padding: 8px 13px; border-radius: 6px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 13.5px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
  .btn:hover { border-color: var(--accent-2); }
  .btn.pri { border-color: var(--accent-2); background: rgba(95,174,142,.14); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* painel do país */
  .pais-cab { padding: 22px 30px 16px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--pane); z-index: 5; }
  .pais-cab h2 { display: flex; align-items: center; gap: 12px; font: 500 32px/1.1 "Source Serif 4", Georgia, serif; margin: 8px 0 6px; }
  .pais-cab .ref { font-size: 13.5px; color: var(--ink-2); }
  .tag { font: 500 10.5px/1.6 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 3px; color: var(--muted); vertical-align: middle; }
  .fechar { position: absolute; top: 18px; right: 22px; width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; color: var(--ink-2); font-size: 16px; }
  .resumo-txt { margin: 0; font-size: 16px; line-height: 1.55; max-width: 64ch; }
  .resumo-txt + .resumo-txt { margin-top: 8px; }
  .abas { display: flex; gap: 22px; padding: 0 30px; border-bottom: 1px solid var(--rule); position: sticky; z-index: 4; background: var(--pane); }
  .abas button { border: 0; background: transparent; padding: 12px 0; cursor: pointer; color: var(--ink-2); font-size: 14.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .grafico { width: 100%; height: 240px; }
  .grafico.baixo { height: 150px; }
  details.dados { margin-top: 8px; font-size: 13px; }
  details.dados summary { cursor: pointer; color: var(--ink-2); }
  details.dados table { border-collapse: collapse; margin-top: 8px; width: 100%; font-variant-numeric: tabular-nums; }
  details.dados th, details.dados td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--rule); }
  details.dados th:first-child, details.dados td:first-child { text-align: left; }
  .barras { list-style: none; margin: 6px 0 0; padding: 0; }
  .barras li { padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .barras .lin { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .barras .lin span:first-child { min-width: 0; }
  .barras .lin .v { white-space: nowrap; color: var(--ink-2); }
  .barras .trilho { height: 6px; background: rgba(255,255,255,.06); border-radius: 3px; margin-top: 5px; }
  .barras .trilho i { display: block; height: 100%; border-radius: 3px; background: var(--exp); }
  .barras.imp .trilho i { background: var(--imp); }
  .barras small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .barras button.link { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .lista-ctx { list-style: none; margin: 6px 0 0; padding: 0; }
  .lista-ctx li { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .lista-ctx li span { display: block; font-size: 12.5px; color: var(--muted); }
  .vazio { border: 1px dashed var(--rule-2); border-radius: 6px; padding: 11px 13px; color: var(--ink-2); font-size: 13.5px; }
  details.ficha summary { cursor: pointer; font: 500 18px/1.3 "Source Serif 4", Georgia, serif; }
  .comp-cab { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .comp-cab .ac input { width: 100%; }
  table.comp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 10px; }
  table.comp th, table.comp td { padding: 8px 6px; border-bottom: 1px solid var(--rule); text-align: right; font-size: 14px; }
  table.comp th:first-child, table.comp td:first-child { text-align: left; color: var(--ink-2); font-weight: 400; }
  table.comp thead th { font-weight: 500; color: var(--ink); }
  .fontes dt { font-weight: 600; margin-top: 14px; }
  select { background: #111a23; border: 1px solid var(--rule-2); border-radius: 5px; padding: 3px 8px; color: var(--ink); }
  .fontes dd { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }

  @media (max-width: 980px) {
    .barra { flex-wrap: wrap; gap: 10px 14px; padding: 10px 14px; }
    .marca span { display: none; }
    .ac input { width: 100%; }
    .barra .ac { order: 3; width: 100%; }
    .quadro { margin: 10px 12px 20px; grid-template-columns: minmax(0, 1fr); height: auto; }
    .lado-mapa { border-right: 0; border-bottom: 1px solid var(--rule); }
    .area { height: 46vh; min-height: 300px; flex: none; }
    .lado-texto { overflow: visible; }
    .sec { padding: 18px 16px; } .sec h2 { font-size: 28px; }
    .pais-cab { padding: 18px 16px 12px; position: relative; } .pais-cab h2 { font-size: 26px; }
    .abas { padding: 0 16px; gap: 16px; overflow-x: auto; position: static; }
    .abas button { white-space: nowrap; }
    .duas, .comp-cab { grid-template-columns: 1fr; }
    .controles { padding: 10px 12px 12px; }
    .metricas button { padding: 6px 9px; }
    .mapa-topo { padding: 10px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="barra">
  <a class="marca" href="./" title="Início do atlas">rotzx<span>Como o Brasil se conecta ao mundo</span></a>
  <div class="ac" id="acTopo">
    <label class="sr" for="busca">Buscar país ou território</label>
    <input id="busca" type="search" placeholder="Buscar país ou território…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="buscaLista" aria-autocomplete="list">
    <ul id="buscaLista" role="listbox" hidden></ul>
  </div>
  <button class="fontes-link" type="button" id="abrirFontes">Fontes e método</button>
</header>

<main class="quadro">
  <section class="lado-mapa" aria-label="Mapa e controles">
    <div class="mapa-topo">
      <div class="modos" role="group" aria-label="Forma de ver">
        <button type="button" data-modo="globo" aria-pressed="true">Globo</button>
        <button type="button" data-modo="lista" aria-pressed="false">Lista</button>
      </div>
      <button class="voltar" id="voltar" type="button"><span aria-hidden="true">←</span> Visão do mundo</button>
    </div>
    <div class="area">
      <div id="globo" role="img" aria-label="Globo: países coloridos pela métrica escolhida. A mesma informação está na lista e nos rankings."></div>
      <div class="lista" id="lista" aria-label="Lista de países e territórios"></div>
      <div class="zoom"><button type="button" id="mais" aria-label="Aproximar o globo">+</button><button type="button" id="menos" aria-label="Afastar o globo">−</button></div>
    </div>
    <div class="controles" id="controles" aria-label="Métrica e ano"></div>
  </section>
  <section class="lado-texto" id="conteudo" aria-live="polite"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="dados/historia.js"></script>
<script>
"use strict";
// =====================================================================================================================
// rotzx — atlas das relações comerciais do Brasil (D47).
// Pergunta-guia: de quem o Brasil depende para vender e para comprar — e como isso mudou ao longo do tempo?
// Só dados medidos, com fonte e ano. Dado ausente ≠ zero. Participações sempre com o denominador dito na tela.
// =====================================================================================================================
const H = window.HISTORIA;
let P = window.PRODUTOS || null;           // explorador por produto: carregado sob demanda (dados/produtos.js)
const C = H.comercio, BR = "076";
const IDS = Object.keys(H.paises).filter((id) => id !== BR);
const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// ---------- formatos ----------
const nf = (v, c) => v.toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
function usd(v) {                     // escala adaptada à grandeza; null = sem dado (nunca "US$ 0,0 bi")
  if (v == null) return "sem dado";
  if (v === 0) return "US$ 0";
  const a = Math.abs(v), s = v < 0 ? "−" : "";
  if (a >= 1e12) return `${s}US$ ${nf(a / 1e12, 2)} tri`;
  if (a >= 1e9) return `${s}US$ ${nf(a / 1e9, a >= 1e11 ? 0 : 1)} bi`;
  if (a >= 1e6) return `${s}US$ ${nf(a / 1e6, a >= 1e8 ? 0 : 1)} mi`;
  if (a >= 1e3) return `${s}US$ ${nf(a / 1e3, 0)} mil`;
  return `${s}US$ ${nf(a, 0)}`;
}
function pct(x, c = 1) {              // x em fração (0,25 = 25%); muito pequeno não vira "0,0%"
  if (x == null) return "sem dado";
  if (x === 0) return "0%";
  if (Math.abs(x) < 0.0005) return x > 0 ? "menos de 0,1%" : "−menos de 0,1%";
  return nf(x * 100, c) + "%";
}
const pp = (d) => (d == null ? "sem dado" : (d >= 0 ? "+" : "−") + nf(Math.abs(d * 100), 1) + " p.p.");
const ord = (n) => `${n}º`, ordF = (n) => `${n}ª`;   // "9º destino", "12ª origem"
const juntarE = (l) => (l.length < 2 ? l.join("") : l.slice(0, -1).join(", ") + " e " + l[l.length - 1]);   // "a, b e c"
const quando = (iso) => (iso ? new Date(iso).toLocaleDateString("pt-BR") : "");

// ---------- países, territórios e bandeiras ----------
const nome = (id) => H.paises[id]?.nome || id;
const ehTerritorio = (id) => H.paises[id]?.tipo === "territorio";
const FLAGS = "https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/flags/4x3/";   // flag-icons (MIT): bandeira atual, não a do ano
function bandeira(id, { grande = false, alt = "" } = {}) {
  const iso2 = (H.paises[id]?.iso2 || "").toLowerCase();
  const cls = "flag" + (grande ? " g" : "");
  if (!iso2) return `<span class="${cls} vazia" aria-hidden="true"></span>`;
  return `<img class="${cls}" src="${FLAGS}${iso2}.svg" width="${grande ? 36 : 20}" height="${grande ? 27 : 15}" alt="${esc(alt)}"${alt ? "" : ' aria-hidden="true"'} loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'${cls} vazia'}))">`;
}

// ---------- séries ----------
const ini = C.inicio, fim = C.fim;
const em = (serie, a, inicio = ini) => (serie && a >= inicio && a - inicio < serie.length ? serie[a - inicio] : null);
const brE = (a) => em(C.brasil.e, a), brI = (a) => em(C.brasil.i, a);
function trocas(id, a) {              // null = sem registro no Comex Stat naquele ano (o Comex só lista fluxos positivos)
  const d = C.paises[id]; if (!d || a < ini || a > fim) return null;
  const e = em(d.e, a), i = em(d.i, a);
  if (e == null && i == null) return null;
  return { e, i, t: (e || 0) + (i || 0), s: (e || 0) - (i || 0), pe: e != null ? e / brE(a) : 0, pi: i != null ? i / brI(a) : 0,
           pt: ((e || 0) + (i || 0)) / (brE(a) + brI(a)) };
}

// ---------- métricas do mapa e dos rankings ----------
const MET = {
  exp: { rot: "Exportações", cab: "Para onde vão as exportações", desc: "exportações do Brasil para o país (US$ FOB correntes)",
         den: "participação = exportações para o país ÷ total exportado pelo Brasil no ano", v: (t) => t?.e ?? null, p: (t) => t?.pe, tipo: "usd" },
  imp: { rot: "Importações", cab: "De onde vêm as importações", desc: "importações do Brasil com origem no país (US$ FOB correntes)",
         den: "participação = importações do país ÷ total importado pelo Brasil no ano", v: (t) => t?.i ?? null, p: (t) => t?.pi, tipo: "usd" },
  corrente: { rot: "Corrente", cab: "Maiores parceiros", desc: "corrente de comércio: exportações + importações (US$ FOB correntes)",
         den: "participação = corrente com o país ÷ corrente total do Brasil no ano", v: (t) => t?.t ?? null, p: (t) => t?.pt, tipo: "usd" },
  part: { rot: "Participação", cab: "Peso de cada parceiro", desc: "participação do parceiro na corrente de comércio do Brasil (%)",
         den: "corrente com o país ÷ corrente total do Brasil (exportações + importações) no ano", v: (t) => t?.pt ?? null, tipo: "pct" },
  mud: { rot: "Mudança", cab: "Quem ganhou e quem perdeu importância", desc: "variação da participação na corrente de comércio entre dois anos, em pontos percentuais",
         den: "participação no ano − participação no ano-base; só países e territórios com comércio registrado nos dois anos", tipo: "pp" },
  prod: { rot: "Produto", cab: "Parceiros de um produto", desc: "participação de cada parceiro no total do produto escolhido", tipo: "prod" },
  onu: { rot: "Votos na ONU", cab: "Concordância nos votos da ONU", desc: "concordância com o Brasil nas votações nominais da Assembleia Geral (0 a 100)", tipo: "onu", ctx: true },
  conf: { rot: "Conflitos", cab: "Onde houve conflito armado", desc: "conflito armado no território (25+ mortes em combate no ano)", tipo: "conf", ctx: true },
};
function cobertura(m) {
  if (m === "onu") return [H.onu.inicio, H.onu.fim];
  if (m === "conf") return [H.conflitos.inicio, H.conflitos.fim];
  return [ini, fim];
}
function valor(id, m = st.m, a = st.ano) {
  const [c0, c1] = cobertura(m);
  if (a < c0 || a > c1) return null;
  if (m === "onu") return em(H.onu.paises[id], a, H.onu.inicio);
  if (m === "conf") { const k = H.conflitos.paises[id]?.[String(a)]; return k ? k.t : 0; }
  if (m === "mud") { const t1 = trocas(id, a), t0 = trocas(id, st.base); return t1 && t0 ? t1.pt - t0.pt : null; }
  if (m === "prod") return prodParte(id);
  const t = trocas(id, a);
  return t ? MET[m].v(t) : null;
}
// escalas FIXAS para todos os anos (dá para comparar anos olhando as cores); a legenda diz isso
const MAX = {};
function maxGlobal(m) {
  if (MAX[m] != null) return MAX[m];
  let mx = 0;
  for (const id of IDS) for (let a = ini; a <= fim; a++) { const t = trocas(id, a); if (t) mx = Math.max(mx, m === "part" ? t.pt : m === "exp" ? t.e || 0 : m === "imp" ? t.i || 0 : t.t); }
  return (MAX[m] = mx);
}
const SEM = "rgba(30,38,48,.55)";
function corDe(id) {
  const m = st.m, v = valor(id);
  if (m === "conf") return v >= 2 ? "rgba(226,120,100,.9)" : v >= 1 ? "rgba(226,160,120,.6)" : "rgba(10,16,28,.25)";
  if (v == null) return SEM;
  if (m === "exp" || m === "imp" || m === "corrente") {
    const t = Math.max(0, Math.min(1, (Math.log10(Math.max(v, 1)) - 6) / (Math.log10(maxGlobal(m)) - 6)));
    return `rgba(${m === "imp" ? "156,203,234" : "143,211,182"},${(0.08 + 0.86 * t * t).toFixed(3)})`;
  }
  if (m === "part") { const t = Math.sqrt(v / maxGlobal("part")); return `rgba(143,211,182,${(0.08 + 0.86 * t).toFixed(3)})`; }
  if (m === "mud") { const t = Math.min(1, Math.sqrt(Math.abs(v) / escalaMud())); return v >= 0 ? `rgba(143,211,182,${(0.1 + 0.85 * t).toFixed(3)})` : `rgba(226,148,127,${(0.1 + 0.85 * t).toFixed(3)})`; }
  if (m === "prod") { const t = Math.sqrt(v); return `rgba(${st.fluxo === "i" ? "156,203,234" : "143,211,182"},${(0.12 + 0.84 * t).toFixed(3)})`; }
  if (m === "onu") { const t = Math.max(0, Math.min(1, (v - 0.3) / 0.7)); return `rgba(170,215,240,${(0.08 + 0.84 * t * t).toFixed(3)})`; }
  return SEM;
}
function escalaMud() { let mx = 0.001; for (const id of IDS) { const v = valor(id, "mud"); if (v != null) mx = Math.max(mx, Math.abs(v)); } return mx; }
function fmtValor(v, m = st.m) {
  if (v == null) return m === "prod" ? "fora dos 12 maiores parceiros (ou sem registro)" : "sem registro neste ano";
  if (MET[m].tipo === "usd") return usd(v);
  if (m === "part" || m === "prod") return pct(v);
  if (m === "mud") return pp(v);
  if (m === "onu") return `${Math.round(v * 100)} de 100`;
  return v >= 2 ? "guerra no território (1.000+ mortes em combate)" : v >= 1 ? "conflito armado no território" : "nenhum conflito no território";
}
function ranking(m = st.m, a = st.ano) {
  const r = IDS.map((id) => [id, valor(id, m, a)]).filter(([, v]) => v != null && (m !== "conf" || v > 0));
  r.sort((x, y) => y[1] - x[1]);
  return r;
}
function posicao(id, m = st.m, a = st.ano) { const r = ranking(m, a); const i = r.findIndex(([x]) => x === id); return i < 0 ? null : [i + 1, r.length]; }

// ---------- produtos ----------
const anosProd = C.anos_produtos;                         // recortes com composição completa por produto (ex.: 2000, 2010, 2025)
const nomeProd = (sh4) => C.curtos?.[sh4] || P?.itens?.[sh4]?.nome || C.sh4[sh4] || sh4;
const oficialProd = (sh4) => C.sh4[sh4] || P?.itens?.[sh4]?.oficial || "";
function anoProdPara(a) { const ok = anosProd.filter((x) => x <= a); return ok.length ? ok[ok.length - 1] : anosProd[0]; }
function prodParte(id) {                                  // parte do país no total do produto escolhido (só os 12 maiores são conhecidos)
  const x = P?.itens?.[st.prod]?.p?.[String(st.ano)]?.[st.fluxo];
  if (!x) return null;
  const hit = x.top.find(([i]) => i === id);
  return hit ? hit[1] / x.t : null;
}
let carregandoP = null;
function carregarProdutos() {
  if (P) return Promise.resolve(P);
  if (!carregandoP) carregandoP = new Promise((ok, erro) => {
    const s = document.createElement("script"); s.src = "dados/produtos.js";
    s.onload = () => { P = window.PRODUTOS; ok(P); }; s.onerror = () => erro(new Error("não carregou dados/produtos.js"));
    document.head.appendChild(s);
  });
  return carregandoP;
}

// ---------- estado (na URL: #pais=CHN&ano=2025&m=exp&prod=1201&fluxo=e&vs=USA) ----------
const st = { pais: null, ano: fim, m: "corrente", base: 2000, prod: null, fluxo: "e", vs: null, aba: "comercial", vista: "inicio", modo: "globo" };
const porIso3 = Object.fromEntries(Object.entries(H.paises).map(([id, p]) => [p.iso3, id]));
function urlDe(s) {
  const q = new URLSearchParams();
  if (s.pais) q.set("pais", H.paises[s.pais].iso3);
  if (s.vista !== "inicio" && !s.pais) q.set("ver", s.vista);
  q.set("ano", s.ano); q.set("m", s.m);
  if (s.m === "mud" || s.vista === "ranking") q.set("base", s.base);
  if (s.prod) { q.set("prod", s.prod); q.set("fluxo", s.fluxo); }
  if (s.vs) q.set("vs", H.paises[s.vs].iso3);
  if (s.pais && s.aba !== "comercial") q.set("aba", s.aba);
  return "#" + q.toString();
}
function lerURL() {
  const h = decodeURIComponent(location.hash.slice(1));
  const s = { pais: null, ano: fim, m: "corrente", base: 2000, prod: null, fluxo: "e", vs: null, aba: "comercial", vista: "inicio" };
  if (!h) return s;
  if (!h.includes("=")) {                                  // links antigos: #China, #Estados%20Unidos
    const id = Object.keys(H.paises).find((k) => H.paises[k].nome.toLowerCase() === h.toLowerCase()) || porIso3[h.toUpperCase()];
    if (id) s.pais = id;
    return s;
  }
  const q = new URLSearchParams(h);
  const n = (k, d) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) ? v : d; };
  s.pais = porIso3[(q.get("pais") || "").toUpperCase()] || null;
  s.vs = porIso3[(q.get("vs") || "").toUpperCase()] || null;
  s.m = MET[q.get("m")] ? q.get("m") : "corrente";
  s.ano = n("ano", fim); s.base = n("base", 2000);
  s.prod = q.get("prod") || null; s.fluxo = q.get("fluxo") === "i" ? "i" : "e";
  s.aba = ["comercial", "produtos", "contexto"].includes(q.get("aba")) ? q.get("aba") : "comercial";
  s.vista = ["ranking", "produto", "comparar", "fontes", "lista"].includes(q.get("ver")) ? q.get("ver") : (s.vs ? "comparar" : s.prod ? "produto" : "inicio");
  const [c0, c1] = cobertura(s.m); s.ano = Math.min(c1, Math.max(c0, s.ano));
  s.base = Math.min(Math.max(ini, s.base), fim);
  return s;
}
function ir(mud, { push = true } = {}) {
  const antes = st.pais;
  Object.assign(st, mud);
  if (st.m === "prod" && !st.prod) st.m = "corrente";
  const [c0, c1] = cobertura(st.m); st.ano = Math.min(c1, Math.max(c0, st.ano));
  if (st.m === "prod" && !anosProd.includes(st.ano)) st.ano = anoProdPara(st.ano);
  const u = urlDe(st);
  if (u !== location.hash) history[push ? "pushState" : "replaceState"](null, "", u);
  render(antes !== st.pais);
}
addEventListener("popstate", () => { const antes = st.pais; Object.assign(st, lerURL()); render(antes !== st.pais); });

// ---------- render geral ----------
function render(paisMudou = false) {
  document.body.classList.toggle("com-pais", !!st.pais);
  document.body.classList.toggle("com-vista", !st.pais && st.vista !== "inicio");
  document.title = st.pais ? `${nome(st.pais)} e o Brasil — rotzx` : "rotzx — Como o Brasil se conecta ao mundo";
  renderControles();
  if (st.m === "prod" && !P) carregarProdutos().then(() => render()).catch(() => {});
  const $c = $("#conteudo");
  const rolagem = $c.scrollTop, focado = $c.contains(document.activeElement) ? document.activeElement.id : "";
  if (st.pais) $c.innerHTML = painelPais(st.pais);
  else if (st.vista === "ranking") $c.innerHTML = vistaRanking();
  else if (st.vista === "produto") $c.innerHTML = vistaProduto();
  else if (st.vista === "comparar") $c.innerHTML = vistaComparar();
  else if (st.vista === "fontes") $c.innerHTML = vistaFontes();
  else $c.innerHTML = vistaInicio();
  if (!paisMudou) $c.scrollTop = rolagem; else $c.scrollTop = 0;
  ligarConteudo($c);
  if (focado) $("#" + focado)?.focus({ preventScroll: true });   // redesenhar não pode tirar o foco de quem usa teclado
  renderLista();
  if (globo) {
    globo.polygonCapColor(corPol).polygonAltitude((p) => (p.id === st.pais ? 0.03 : p.id === st.vs ? 0.018 : 0.006));
    if (paisMudou) enquadrar();
  }
  requestAnimationFrame(desenharGraficos);
}

// ---------- controles (métrica, ano, legenda) ----------
let tocando = null;
function renderControles() {
  const [c0, c1] = cobertura(st.m);
  const prod = st.m === "prod";
  const metricas = ["exp", "imp", "corrente", "part", "mud"].map((k) => `<button type="button" data-m="${k}" aria-pressed="${st.m === k}">${MET[k].rot}</button>`).join("")
    + (st.prod ? `<button type="button" data-m="prod" aria-pressed="${prod}">${esc(nomeCurtoMax(st.prod))}</button>` : "")
    + `<span class="sep">Contexto:</span>` + ["onu", "conf"].map((k) => `<button type="button" data-m="${k}" aria-pressed="${st.m === k}">${MET[k].rot}</button>`).join("");
  const ano = prod
    ? `<div class="anos-chips" role="group" aria-label="Ano com composição por produto">${anosProd.map((a) => `<button type="button" data-ano="${a}" aria-pressed="${st.ano === a}">${a}</button>`).join("")}</div>`
    : `<div class="ano-linha"><button type="button" id="play" aria-label="${tocando ? "Pausar" : "Avançar ano a ano"}">${tocando ? "❚❚" : "▶"}</button>
        <input type="range" id="ano" min="${c0}" max="${c1}" step="1" value="${st.ano}" aria-label="Ano de referência"><output for="ano">${st.ano}</output></div>`;
  $("#controles").innerHTML = `<div class="metricas" role="group" aria-label="O que o mapa mostra">${metricas}</div>${ano}<div class="leg">${legenda()}</div>`;
}
const nomeCurtoMax = (c) => { const n = nomeProd(c); return n.length > 26 ? n.slice(0, 24) + "…" : n; };
function legenda() {
  const [c0, c1] = cobertura(st.m), m = st.m;
  const desc = m === "mud" ? `${MET.mud.desc}: ${st.base} → ${st.ano}` : m === "prod" ? `${esc(nomeProd(st.prod))}: participação de cada parceiro nas ${st.fluxo === "e" ? "exportações" : "importações"} brasileiras do produto em ${st.ano}` : MET[m].desc;
  let esc_ = "";
  if (m === "exp" || m === "imp" || m === "corrente") esc_ = `<div class="grad" style="background:linear-gradient(90deg,${m === "imp" ? "rgba(156,203,234,.1),rgba(156,203,234,.94)" : "rgba(143,211,182,.1),rgba(143,211,182,.94)"})"></div>
    <div class="ext"><span>US$ 1 mi ou menos</span><span>${usd(maxGlobal(m))}</span></div><div>Escala logarítmica fixa para todos os anos (valores correntes, sem correção pela inflação).</div>`;
  else if (m === "part") esc_ = `<div class="grad" style="background:linear-gradient(90deg,rgba(143,211,182,.1),rgba(143,211,182,.94))"></div><div class="ext"><span>0%</span><span>${pct(maxGlobal("part"))}</span></div><div>Escala fixa para todos os anos.</div>`;
  else if (m === "mud") esc_ = `<div class="grad" style="background:linear-gradient(90deg,rgba(226,148,127,.95),rgba(226,148,127,.1),rgba(143,211,182,.1),rgba(143,211,182,.95))"></div><div class="ext"><span>${pp(-escalaMud())} (perdeu)</span><span>0</span><span>${pp(escalaMud())} (ganhou)</span></div><div>Escala ajustada a este par de anos.</div>`;
  else if (m === "prod") esc_ = P ? `<div class="grad" style="background:linear-gradient(90deg,rgba(143,211,182,.12),rgba(143,211,182,.96))"></div><div class="ext"><span>0%</span><span>100%</span></div><div>Só os 12 maiores parceiros de cada produto estão na base; os demais aparecem em cinza.</div>` : "Carregando dados de produtos…";
  else if (m === "onu") esc_ = `<div class="grad" style="background:linear-gradient(90deg,rgba(170,215,240,.08),rgba(170,215,240,.92))"></div><div class="ext"><span>30 ou menos</span><span>100</span></div><div>Concordância de votos não equivale a aliança política.</div>`;
  else esc_ = `<div class="cats"><span><i style="background:rgba(226,120,100,.9)"></i>guerra no território</span><span><i style="background:rgba(226,160,120,.6)"></i>conflito no território</span></div><div>Missões de paz e tropas fora do país aparecem no painel de cada país, não no mapa.</div>`;
  const fora = st.ano < c0 || st.ano > c1;
  return `<div>${esc(desc)} · cobertura ${c0}–${c1}.</div>${fora ? `<div class="aviso">Sem dado nesta métrica em ${st.ano}.</div>` : esc_}<div><i style="background:${SEM}"></i>sem registro no ano</div>`;
}
function tocar() {
  if (tocando) { clearInterval(tocando); tocando = null; return renderControles(); }
  const [c0, c1] = cobertura(st.m);
  if (st.ano >= c1) ir({ ano: c0 }, { push: false });
  tocando = setInterval(() => { if (st.ano >= cobertura(st.m)[1]) { clearInterval(tocando); tocando = null; return renderControles(); } ir({ ano: st.ano + 1 }, { push: false }); }, reduzir ? 1400 : 800);
  renderControles();
}
$("#controles").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.m) ir({ m: b.dataset.m, vista: st.pais ? st.vista : (["onu", "conf"].includes(b.dataset.m) ? st.vista : st.vista === "inicio" ? "ranking" : st.vista) }, { push: false });
  else if (b.dataset.ano) ir({ ano: +b.dataset.ano }, { push: false });
  else if (b.id === "play") tocar();
});
$("#controles").addEventListener("input", (e) => { if (e.target.id === "ano") ir({ ano: +e.target.value }, { push: false }); });

// ---------- início: dar um motivo para explorar ----------
function concentracao(k, a) {          // parte do maior e dos 5 maiores parceiros no total do Brasil (denominador: total do Brasil)
  const tot = k === "e" ? brE(a) : brI(a);
  const r = IDS.map((id) => [id, em(C.paises[id]?.[k], a)]).filter(([, v]) => v).sort((x, y) => y[1] - x[1]);
  return { n: r.length, top: r[0], p1: r[0][1] / tot, p5: r.slice(0, 5).reduce((s, [, v]) => s + v, 0) / tot };
}
function vistaInicio() {
  const a = Math.min(st.ano, fim), e = brE(a), i = brI(a), ce = concentracao("e", a), ci = concentracao("i", a);
  const top = ranking("corrente", a).slice(0, 5);
  const china00 = trocas("156", 2000), china = trocas("156", a);
  return `<div class="sec"><div class="kicker">rotzx</div><h2>Como o Brasil se conecta ao mundo</h2>
      <p class="lead">Explore nossos parceiros comerciais, descubra o que compramos e vendemos e acompanhe como essas relações mudaram desde ${ini}.</p></div>
    <div class="sec"><h3>O comércio do Brasil em ${a}</h3><p class="fonte">Comex Stat (MDIC) · US$ FOB correntes · ano de ${a}</p>
      <div class="kpis"><div class="kpi"><span>Exportações</span><b class="num">${usd(e)}</b></div><div class="kpi"><span>Importações</span><b class="num">${usd(i)}</b></div>
        <div class="kpi"><span>Saldo</span><b class="num">${(e - i >= 0 ? "+" : "") + usd(e - i)}</b><small>${e - i >= 0 ? "superávit" : "déficit"}</small></div>
        <div class="kpi"><span>Corrente (exp. + imp.)</span><b class="num">${usd(e + i)}</b></div></div>
      <p class="resumo-txt">${bandeira(ce.top[0])} <b>${esc(nome(ce.top[0]))}</b> recebeu ${pct(ce.p1)} das exportações brasileiras; os 5 maiores destinos somaram ${pct(ce.p5)}.
        ${bandeira(ci.top[0])} <b>${esc(nome(ci.top[0]))}</b> foi a origem de ${pct(ci.p1)} das importações; as 5 maiores origens, ${pct(ci.p5)}.
        O Brasil vendeu para ${ce.n} e comprou de ${ci.n} países e territórios.</p>
      <p class="nota">Denominador: total exportado ou importado pelo Brasil no ano (inclui operações sem país definido, como provisão de navios).</p></div>
    <div class="sec"><h3>Comece por uma pergunta</h3><div class="perguntas">
      <button type="button" data-ir='${JSON.stringify({ vista: "ranking", m: "corrente", pais: null })}'>Quais são os maiores parceiros do Brasil?</button>
      <button type="button" data-ir='${JSON.stringify({ vista: "ranking", m: "exp", pais: null })}'>Para onde vão nossas exportações?</button>
      <button type="button" data-ir='${JSON.stringify({ vista: "ranking", m: "imp", pais: null })}'>De onde vêm nossas importações?</button>

function listaRank(r, m, a, { total = null } = {}) {
  const max = Math.max(...r.map(([, v]) => Math.abs(v)), 1e-12);
  return `<ol class="rank">${r.map(([id, v], k) => {
    const t = trocas(id, a);
    const extra = MET[m].tipo === "usd" && t ? `<small>${pct(MET[m].p(t))} do total</small>` : m === "mud" ? `<small>${pct(trocas(id, st.base)?.pt)} → ${pct(t?.pt)}</small>` : "";
    return `<li><button type="button" data-pais="${id}"><span class="pos">${(total ? total[k] : k + 1)}º</span>${bandeira(id)}<span class="nome">${esc(nome(id))}${ehTerritorio(id) ? ' <span class="tag">território</span>' : ""}</span>
      <span class="val num">${fmtValor(v, m)}${extra}</span><span class="barra-v${v < 0 ? " neg" : ""}" style="width:calc((100% - 160px) * ${(Math.abs(v) / max).toFixed(3)})"></span></button></li>`;
  }).join("")}</ol>`;
}

function anoUlt(serie, inicio, a) { for (let x = Math.min(a, inicio + serie.length - 1); x >= inicio; x--) if (serie[x - inicio] != null) return x; return null; }

                  t.i ? `origem de <b>${pct(t.pi)}</b> das importações${pi ? ` (${ord(pi[0])} lugar)` : ""}` : "nenhuma importação registrada"];
  frases.push(`Em ${a}: ${partes.join("; ")}.`);

  if (x && x.top.length) {
    const tres = x.top.slice(0, Math.min(3, x.top.length)), s = tres.reduce((q, [, v]) => q + v, 0) / x.t;
    const quando = `${ap}${ap !== a ? ` (composição por produto disponível em ${anosProd.join(", ")})` : ""}`;
    // nome curto revisado na frase; sem ele, não se encurta o nome oficial por conta própria: a lista completa está na aba Produtos

function painelPais(id) {

      <div class="ref">Ano de referência: <b>${a}</b>${st.ano > fim ? ` (comércio só até ${fim})` : ""}${pos && id !== BR ? ` · <b>${ord(pos[0])}</b> de ${pos[1]} em ${MET[m === "mud" ? "corrente" : m].rot.toLowerCase()}` : ""}
        <span class="sr">. A bandeira é a atual, não a do ano.</span></div>
      <div class="botoes">${id !== BR ? `<button class="btn" type="button" data-ir='${JSON.stringify({ vista: "comparar", vs: id, pais: null })}'>Comparar com outro parceiro</button>` : ""}

  if (id === BR) return cab + painelBrasil(a);

// ---------- busca (bandeira + nome; teclado: ↑ ↓ Enter Esc) ----------
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function buscarPais(q) {
  const n = norm(q.trim()); if (!n) return [];
  return Object.keys(H.paises).filter((id) => norm(nome(id)).includes(n) || H.paises[id].iso3.toLowerCase() === n)
    .sort((a, b) => (norm(nome(a)).startsWith(n) ? 0 : 1) - (norm(nome(b)).startsWith(n) ? 0 : 1) || nome(a).localeCompare(nome(b))).slice(0, 12)
    .map((id) => ({ v: id, html: `${bandeira(id)}<span>${esc(nome(id))}</span>${ehTerritorio(id) ? "<small>território</small>" : ""}` }));
}
function buscarProduto(q) {
  const n = norm(q.trim()); if (!n || !P) return [];
  return Object.entries(P.itens).filter(([c, x]) => norm(x.nome).includes(n) || norm(x.oficial).includes(n) || c === n)
    .sort((a, b) => (a[0].startsWith("g-") ? 0 : 1) - (b[0].startsWith("g-") ? 0 : 1) || (norm(a[1].nome).startsWith(n) ? 0 : 1) - (norm(b[1].nome).startsWith(n) ? 0 : 1)).slice(0, 12)
    .map(([c, x]) => ({ v: c, html: `<span>${esc(x.nome)}</span><small>${c.startsWith("g-") ? "grupo" : "SH4 " + c}</small>` }));
}
function autocompletar(inp, lista, fonte, escolher) {
  let itens = [], sel = -1;
  const fechar = () => { lista.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant"); sel = -1; };
  const mostrar = () => {
    itens = fonte(inp.value);
    if (!itens.length) return fechar();
    lista.innerHTML = itens.map((x, i) => `<li role="option" id="${lista.id}-${i}" aria-selected="${i === sel}" data-i="${i}">${x.html}</li>`).join("");
    lista.hidden = false; inp.setAttribute("aria-expanded", "true");
    if (sel >= 0) inp.setAttribute("aria-activedescendant", `${lista.id}-${sel}`);
  };
  inp.oninput = () => { sel = -1; mostrar(); };
  inp.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (lista.hidden) mostrar(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + itens.length) % itens.length; mostrar(); }
    else if (e.key === "Enter") { e.preventDefault(); const x = itens[sel >= 0 ? sel : 0]; if (x) { fechar(); escolher(x.v); inp.blur(); } }
    else if (e.key === "Escape") fechar();
  };
  lista.onmousedown = (e) => { const li = e.target.closest("li"); if (!li) return; e.preventDefault(); const x = itens[+li.dataset.i]; fechar(); escolher(x.v); };
  inp.onblur = () => setTimeout(fechar, 120);
}

addEventListener("keydown", (e) => { if (e.key === "Escape" && st.pais && !e.target.closest(".ac")) ir({ pais: null }); });

// ---------- gráficos (ECharts) ----------
let graficos = [];
const eixoX = (a0, a1) => ({ type: "category", data: Array.from({ length: a1 - a0 + 1 }, (_, i) => String(a0 + i)), axisLine: { lineStyle: { color: "rgba(255,255,255,.15)" } }, axisLabel: { color: "#8a959b" } });
const eixoY = (fmt) => ({ type: "value", splitLine: { lineStyle: { color: "rgba(255,255,255,.06)" } }, axisLabel: { color: "#8a959b", formatter: fmt } });
const marca = () => ({ symbol: "none", silent: true, label: { show: false }, lineStyle: { color: "#e7ecea", type: "dashed", width: 1 }, data: [{ xAxis: String(st.ano) }] });
const usdEixo = (v) => (v >= 1e9 ? nf(v / 1e9, 0) + " bi" : v >= 1e6 ? nf(v / 1e6, 0) + " mi" : nf(v, 0));
function desenharGraficos() {
  graficos.forEach((g) => g.dispose()); graficos = [];
  if (typeof echarts === "undefined") return;
  const novo = (sel, opt) => { const el = $(sel); if (!el) return; const g = echarts.init(el, null, { renderer: "svg" });
    g.setOption({ textStyle: { color: "#b7c0c2", fontFamily: "IBM Plex Sans" }, grid: { left: 56, right: 14, top: 34, bottom: 26 }, animation: !reduzir, ...opt });
    g.on("click", (p) => { if (p.name && /^\d{4}$/.test(p.name)) ir({ ano: +p.name }, { push: false }); }); graficos.push(g); };
  const leg = (nomes) => ({ data: nomes, textStyle: { color: "#b7c0c2" }, top: 0, right: 0 });
  const id = st.pais;
  if (id) {
    const d = id === BR ? C.brasil : C.paises[id];
    if (d) novo("#gValores", { tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "sem registro" : usd(v)) }, legend: leg(["Exportações do Brasil", "Importações do Brasil"]),
      xAxis: eixoX(ini, fim), yAxis: eixoY(usdEixo),
      series: [{ name: "Exportações do Brasil", type: "line", data: d.e, connectNulls: false, symbolSize: 5, itemStyle: { color: "#8fd3b6" }, markLine: marca() },
        { name: "Importações do Brasil", type: "line", data: d.i, connectNulls: false, symbolSize: 5, itemStyle: { color: "#9ccbea" } }] });
    if (d && id !== BR) novo("#gPartes", { tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "sem registro" : pct(v)) }, legend: leg(["% das exportações do Brasil", "% das importações do Brasil"]),
      xAxis: eixoX(ini, fim), yAxis: eixoY((v) => nf(v * 100, 0) + "%"),
      series: [{ name: "% das exportações do Brasil", type: "line", data: d.e.map((v, j) => (v == null ? null : v / brE(ini + j))), symbolSize: 4, itemStyle: { color: "#8fd3b6" }, markLine: marca() },
        { name: "% das importações do Brasil", type: "line", data: d.i.map((v, j) => (v == null ? null : v / brI(ini + j))), symbolSize: 4, itemStyle: { color: "#9ccbea" } }] });
    const u = H.onu.paises[id];
    if (u) novo("#gOnu", { tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "sem votação" : `${Math.round(v * 100)} de 100`) }, legend: leg([nome(id), "Mediana dos países"]),
      xAxis: eixoX(H.onu.inicio, H.onu.fim), yAxis: { ...eixoY((v) => Math.round(v * 100)), min: 0, max: 1 },
      series: [{ name: nome(id), type: "line", data: u, symbolSize: 3, itemStyle: { color: "#aad7f0" }, markLine: marca() },
        { name: "Mediana dos países", type: "line", data: H.onu.mediana, symbol: "none", lineStyle: { type: "dotted", color: "#8a959b" }, itemStyle: { color: "#8a959b" } }] });
    const k = H.conflitos.paises[id];
    if (k) { const anos = Array.from({ length: H.conflitos.fim - H.conflitos.inicio + 1 }, (_, i) => H.conflitos.inicio + i), lin = (f) => anos.map((a) => { const x = k[String(a)]; return x ? f(x) : null; });
      novo("#gConf", { grid: { left: 112, right: 14, top: 8, bottom: 26 }, tooltip: { trigger: "item", formatter: (p) => `${p.name}: ${p.seriesName}` }, xAxis: eixoX(H.conflitos.inicio, H.conflitos.fim),
        yAxis: { type: "category", data: ["Com tropas", "Como lado", "No território"], axisLabel: { color: "#b7c0c2" }, axisLine: { show: false } },
        series: [{ name: "conflito no território", type: "scatter", symbol: "rect", symbolSize: [5, 14], data: lin((x) => (x.t ? 2 : null)), itemStyle: { color: (p) => (k[p.name]?.t >= 2 ? "rgba(226,120,100,.95)" : "rgba(226,160,120,.65)") }, markLine: marca() },
          { name: "lado principal", type: "scatter", symbol: "rect", symbolSize: [5, 14], data: lin((x) => (x.l ? 1 : null)), itemStyle: { color: "#aad7f0" } },
          { name: "tropas de apoio (inclui missões de paz)", type: "scatter", symbol: "rect", symbolSize: [5, 14], data: lin((x) => (x.a ? 0 : null)), itemStyle: { color: "rgba(226,190,150,.6)" } }] }); }
  } else if (st.vista === "produto" && P && st.prod && P.itens[st.prod]) {
    const it = P.itens[st.prod];
    novo("#gProd", { tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "sem registro" : usd(v)) }, legend: leg(["Exportações do Brasil", "Importações do Brasil"]),
      xAxis: eixoX(ini, fim), yAxis: eixoY(usdEixo),
      series: [{ name: "Exportações do Brasil", type: "line", data: it.e, symbolSize: 4, itemStyle: { color: "#8fd3b6" }, lineStyle: { width: st.fluxo === "e" ? 2.5 : 1, opacity: st.fluxo === "e" ? 1 : .5 }, markLine: marca() },
        { name: "Importações do Brasil", type: "line", data: it.i, symbolSize: 4, itemStyle: { color: "#9ccbea" }, lineStyle: { width: st.fluxo === "i" ? 2.5 : 1, opacity: st.fluxo === "i" ? 1 : .5 } }] });
  } else if (st.vista === "comparar") {
    const a = cmpA, b = st.vs || "840", s = (x) => Array.from({ length: fim - ini + 1 }, (_, j) => trocas(x, ini + j)?.pt ?? null);
    novo("#gCmp", { tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "sem registro" : pct(v)) }, legend: leg([nome(a), nome(b)]), xAxis: eixoX(ini, fim), yAxis: eixoY((v) => nf(v * 100, 0) + "%"),
      series: [{ name: nome(a), type: "line", data: s(a), symbolSize: 4, itemStyle: { color: "#8fd3b6" }, markLine: marca() }, { name: nome(b), type: "line", data: s(b), symbolSize: 4, itemStyle: { color: "#e0b45c" } }] });
  }
}
addEventListener("resize", () => graficos.forEach((g) => g.resize()));

// ---------- globo ----------
let globo = null, poligonos = [], sobre = null;
const TEXTURAS = "https://cdn.jsdelivr.net/npm/three-globe@2.45.6/example/img/";
function corPol(f) {
  if (f.id === st.pais) return "rgba(240,248,244,.62)";
  if (f === sobre) return "rgba(231,236,234,.5)";
  if (f.id === BR) return "rgba(143,211,182,.62)";
  return corDe(f.id);
}
function centro(f) {
  const g = f.geometry; if (!g) return null;
  const aneis = g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map((p) => p[0]);
  const maior = aneis.sort((a, b) => b.length - a.length)[0];
  const lngs = maior.map((c) => c[0]), lats = maior.map((c) => c[1]);
  const span = Math.max(Math.max(...lngs) - Math.min(...lngs), Math.max(...lats) - Math.min(...lats));
  return { lat: lats.reduce((s, x) => s + x, 0) / lats.length, lng: lngs.reduce((s, x) => s + x, 0) / lngs.length, altitude: Math.min(2.4, Math.max(0.55, span / 26)) };
}
function enquadrar() {
  if (!globo) return;
  const f = st.pais && poligonos.find((p) => p.id === st.pais);
  const alvo = f ? centro(f) : st.pais ? null : { lat: -12, lng: -45, altitude: 2.35 };
  globo.controls().autoRotate = !st.pais && !reduzir;
  if (alvo) globo.pointOfView(alvo, reduzir ? 0 : 1100);
}
function tingir() {
  const mat = globo.globeMaterial();
  mat.shininess = 0; mat.specular.set("#000000");
  if ("bumpScale" in mat) mat.bumpScale = 6;
  if (!mat.map) return setTimeout(tingir, 250);
  mat.color = mat.specular.clone().set("#5a7b7e"); mat.needsUpdate = true;
}
function iniciarGlobo(atlas) {
  poligonos = topojson.feature(atlas, atlas.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const el = $("#globo");
  globo = Globe()(el)
    .backgroundColor("rgba(0,0,0,0)").globeImageUrl(TEXTURAS + "earth-blue-marble.jpg").bumpImageUrl(TEXTURAS + "earth-topology.png")
    .showGraticules(true).showAtmosphere(true).atmosphereColor("#7cc3b0").atmosphereAltitude(0.13)
    .polygonsData(poligonos).polygonCapColor(corPol).polygonSideColor(() => "rgba(205,236,226,0.04)").polygonStrokeColor(() => "rgba(205,236,226,.28)")
    .polygonAltitude((p) => (p.id === st.pais ? 0.03 : 0.006)).polygonsTransitionDuration(reduzir ? 0 : 250)
    .polygonLabel((f) => { const id = f.id; if (!H.paises[id]) return `<div class="tip"><b>${esc(f.properties.name)}</b><span>sem dados na base</span></div>`;
      const v = id === BR ? null : valor(id), p = id === BR ? null : posicao(id);
      return `<div class="tip">${bandeira(id)} <b>${esc(nome(id))}</b><span>${id === BR ? "ponto de referência da análise" : `${esc(MET[st.m].rot)} em ${st.ano}: ${esc(fmtValor(v))}${p ? ` · ${ord(p[0])} de ${p[1]}` : ""}`}</span></div>`; })
    .onPolygonHover((f) => { sobre = f; globo.polygonCapColor(corPol); el.style.cursor = f ? "pointer" : "grab"; })
    .onPolygonClick((f) => { if (H.paises[f.id]) abrirPais(f.id); });
  tingir();
  globo.controls().autoRotateSpeed = 0.18;
  const ajustar = () => globo.width(el.clientWidth).height(el.clientHeight);
  addEventListener("resize", ajustar); if (window.ResizeObserver) new ResizeObserver(ajustar).observe(el); ajustar();
  enquadrar();
}
$("#mais").onclick = () => { if (!globo) return; const v = globo.pointOfView(); globo.controls().autoRotate = false; globo.pointOfView({ ...v, altitude: Math.max(0.25, v.altitude * 0.75) }, 300); };
$("#menos").onclick = () => { if (!globo) return; const v = globo.pointOfView(); globo.pointOfView({ ...v, altitude: Math.min(4, v.altitude * 1.33) }, 300); };

// ---------- partida ----------
autocompletar($("#busca"), $("#buscaLista"), buscarPais, (id) => { $("#busca").value = ""; abrirPais(id); });
Object.assign(st, lerURL());
if (location.hash && !location.hash.includes("=")) history.replaceState(null, "", urlDe(st));   // converte #China em #pais=CHN…
render(true);
(async () => {
  try {
    if (typeof Globe !== "function") throw new Error("globe.gl não carregou");
    const t = document.createElement("canvas"); if (!(t.getContext("webgl2") || t.getContext("webgl"))) throw new Error("sem WebGL");
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
    if (!r.ok) throw new Error("mapa não carregou");
    iniciarGlobo(await r.json());
  } catch (e) {
    console.warn("Globo indisponível:", e.message);
    semGlobo = true; $(".zoom").hidden = true; $('[data-modo="globo"]').disabled = true; modo("lista");
  }
})();
