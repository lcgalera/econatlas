<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rotzx — O mundo visto do Brasil</title>
<meta name="description" content="Globo interativo: clique num país para ver a relação com o Brasil, a economia e as manchetes.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Um quadro só, dividido em dois: o globo à esquerda e o texto à direita. Tema escuro, linhas finas, um acento verde. */
  :root {
    --bg: #090d12; --frame: #0c1219; --pane: #0e151d; --rule: rgba(255,255,255,.08); --rule-2: rgba(255,255,255,.14);
    --ink: #e7ecea; --ink-2: #b7c0c2; --muted: #7f8b91; --accent: #8fd3b6; --accent-2: #5fae8e; --warn: #e0b45c;
    /* nomes usados pelos blocos do painel */
    --panel: var(--pane); --panel-ink: var(--ink); --panel-ink-2: var(--ink-2); --panel-muted: var(--muted); --panel-rule: var(--rule);
    --chip: rgba(255,255,255,.05); --chip-ink: var(--ink-2);
    /* globo: países como camadas translúcidas sobre o relevo */
    --space: #0b121a; --land: rgba(120,168,162,.14); --land-hover: rgba(160,205,196,.26);
    --focus: rgba(140,196,182,.30); --focus-hover: rgba(160,215,200,.48); --focus-solid: #7fb5a7;
    --base: rgba(143,211,182,.58); --base-hover: rgba(165,228,200,.72); --base-solid: #8fd3b6;
    --sel: rgba(226,246,238,.50); --stroke: rgba(205,236,226,.26);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .kicker { font: 500 11px/1 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* ---- barra de cima: marca, estado dos dados e busca ---- */
  .barra { display: flex; align-items: center; gap: 22px; padding: 14px 32px; border-bottom: 1px solid var(--rule); }
  .marca { font: 600 19px/1 "Source Serif 4", Georgia, serif; text-decoration: none; white-space: nowrap; }
  .marca span { font: 400 14px/1 "IBM Plex Sans", sans-serif; color: var(--muted); margin-left: 10px; }
  .estado { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12.5px; color: var(--ink-2); }
  .estado b { font: 500 11px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
  .estado .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .estado a { color: var(--ink-2); white-space: nowrap; text-underline-offset: 3px; }
  .ponto { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .ponto.aviso { background: var(--warn); }
  .busca { margin-left: auto; }
  .busca input { width: 230px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--rule-2); background: transparent;
                 color: var(--ink); font: inherit; font-size: 14px; outline: none; }
  .busca input::placeholder { color: var(--muted); }
  .busca input:focus { border-color: var(--accent-2); }

  /* ---- o quadro ---- */
  .quadro { margin: 20px 32px 32px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            height: max(600px, calc(100vh - 106px)); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--frame); }
  .lado-globo { position: relative; border-right: 1px solid var(--rule);
                background: radial-gradient(ellipse at 50% 46%, #122130 0%, var(--frame) 62%); }
  #globo { position: absolute; inset: 0; }
  .lado-texto { background: var(--pane); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }

  .pane-topo { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 22px 26px; pointer-events: none; }
  .pane-topo > * { pointer-events: auto; }
  .titulo-globo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
  .titulo-globo svg { flex: none; }
  .voltar { display: none; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border: 1px solid var(--rule-2); border-radius: 6px;
            background: rgba(9,13,18,.6); cursor: pointer; font-size: 14px; }
  .voltar:hover { border-color: var(--accent-2); }
  body.aberto .voltar { display: inline-flex; }
  body.aberto .titulo-globo { display: none; }
  .modos { margin-left: auto; display: flex; padding: 3px; border: 1px solid var(--rule-2); border-radius: 7px; background: rgba(9,13,18,.55); }
  .modos button { border: 0; background: transparent; padding: 6px 12px; border-radius: 5px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .modos button[aria-pressed="true"] { background: rgba(255,255,255,.08); color: var(--ink); }

  .zoom { position: absolute; right: 22px; bottom: 22px; z-index: 3; display: grid; border: 1px solid var(--rule-2); border-radius: 7px; overflow: hidden; background: rgba(9,13,18,.6); }
  .zoom button { width: 38px; height: 36px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--ink-2); }
  .zoom button + button { border-top: 1px solid var(--rule-2); }
  .zoom button:hover { color: var(--ink); background: rgba(255,255,255,.05); }
  .legenda { position: absolute; left: 26px; bottom: 22px; z-index: 3; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }

  /* lista de países (alternativa ao globo) */
  .lista { position: absolute; inset: 0; z-index: 2; display: none; overflow-y: auto; padding: 84px 26px 26px; background: var(--frame); }
  body.modo-lista .lista { display: block; }
  body.modo-lista .zoom, body.modo-lista .legenda, body.sem-globo .zoom, body.sem-globo .legenda { display: none; }
  body.sem-globo .modos button[data-modo="globo"] { opacity: .45; cursor: not-allowed; }
  .lista ol { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 28px; }
  .lista li { break-inside: avoid; }
  .lista button { width: 100%; display: flex; justify-content: space-between; gap: 12px; padding: 11px 2px; border: 0; border-bottom: 1px solid var(--rule);
                  background: transparent; cursor: pointer; text-align: left; font-size: 14.5px; }
  .lista button:hover { color: var(--accent); }
  .lista button span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lista .nota-lista { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }

  .tip { background: rgba(9,13,18,.94); border: 1px solid var(--rule-2); padding: 6px 9px; border-radius: 5px; font: 13px/1.35 "IBM Plex Sans", sans-serif; color: var(--ink); }
  .tip b { display: block; font-weight: 500; }
  .tip span { color: var(--muted); font-size: 12px; }

  /* ---- coluna de texto ---- */
  .cab { padding: 34px 36px 0; }
  .cab h2 { font: 500 40px/1.1 "Source Serif 4", Georgia, serif; letter-spacing: -.01em; margin: 12px 0 8px; }
  .cab .sub { margin: 0; color: var(--ink-2); font-size: 15px; }
  .abas-topo { display: flex; gap: 26px; margin: 26px 36px 0; border-bottom: 1px solid var(--rule); }
  .abas-topo button { border: 0; background: transparent; padding: 0 0 12px; cursor: pointer; color: var(--ink-2); font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas-topo button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 36px 0; }
  .filtros button { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
  .filtros button small { color: var(--muted); margin-left: 6px; font-size: 12px; }
  .filtros button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filtros button[aria-pressed="true"] small { color: #4b555b; }
  .regra { margin: 14px 36px 0; font-size: 12.5px; color: var(--muted); }
  .corpo { padding: 8px 36px 8px; }
  .manchetes { list-style: none; margin: 0; padding: 0; }
  .manchetes li { padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .manchetes a { display: block; text-decoration: none; font: 500 18px/1.35 "Source Serif 4", Georgia, serif; }
  .manchetes a:hover { color: var(--accent); }
  .manchetes span { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .nada { padding: 40px 0 24px; }
  .nada h3 { font: 500 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 10px; }
  .nada p { margin: 0 0 20px; color: var(--ink-2); max-width: 46ch; }
  .botao { padding: 10px 16px; border-radius: 6px; border: 1px solid var(--accent-2); background: rgba(95,174,142,.12); cursor: pointer; font-size: 14px; }
  .botao:hover { background: rgba(95,174,142,.2); }
  .rodape { display: flex; align-items: center; gap: 9px; padding: 22px 36px 30px; font-size: 12.5px; color: var(--muted); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .kpi { background: var(--pane); padding: 12px 14px; }
  .kpi span { display: block; font-size: 12px; color: var(--muted); }
  .kpi b { display: block; margin-top: 2px; font: 500 21px/1.25 "Source Serif 4", Georgia, serif; color: var(--ink); }
  .kpi small { font-size: 12px; color: var(--muted); }
  .secao { margin: 26px 0 10px; }
  .parceiros { list-style: none; margin: 0; padding: 0; }
  .parceiros button { width: 100%; position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 10px 10px; margin: 4px 0;
                      border: 0; border-radius: 4px; background: transparent; cursor: pointer; text-align: left; font-size: 14px; }
  .parceiros button:disabled { cursor: default; }
  .parceiros button:not(:disabled):hover span:not(.barra) { color: var(--accent); }
  .parceiros .barra { position: absolute; inset: 0 auto 0 0; background: rgba(143,211,182,.09); border-radius: 4px; z-index: 0; }
  .parceiros span { position: relative; z-index: 1; }
  .parceiros .p-val { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- painel do país (entra no lugar do resumo) ---- */
  .painel { display: none; }
  body.aberto .painel { display: block; animation: entra .3s ease-out; }
  body.aberto .resumo-mundo { display: none; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .painel header { position: sticky; top: 0; z-index: 2; padding: 30px 36px 18px; background: var(--pane); border-bottom: 1px solid var(--rule); }
  .painel h2 { font: 500 36px/1.1 "Source Serif 4", Georgia, serif; margin: 12px 0 6px; }
  .painel .sub { color: var(--ink-2); font-size: 14.5px; margin: 0; }
  .fechar { position: absolute; top: 26px; right: 28px; width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--rule-2);
            background: transparent; font-size: 17px; cursor: pointer; color: var(--ink-2); }
  .fechar:hover { color: var(--ink); border-color: var(--accent-2); }
  .bloco { padding: 24px 36px; border-bottom: 1px solid var(--rule); }
  .bloco h3 { font: 500 21px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
  .fonte { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  .vazio { border: 1px dashed var(--rule-2); border-radius: 6px; padding: 12px 14px; color: var(--muted); font-size: 13.5px; }
  .linhas { display: none; }
  .abas { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
  .abas button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule-2); background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; }
  .abas button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .selo { display: inline-block; font: 500 10.5px/1.6 "IBM Plex Mono", monospace; letter-spacing: .06em; padding: 0 7px; border-radius: 3px;
          border: 1px solid var(--rule-2); color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
  .nota { font-size: 12.5px; color: var(--muted); padding: 20px 36px 30px; margin: 0; }
  .fonte a, .news a, .disputas a { color: inherit; }
  .resumo { margin: 0 0 14px; color: var(--ink); font-size: 15.5px; }
  .prods { list-style: none; margin: 0; padding: 0; }
  .prods li { position: relative; display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; font-size: 13.5px; margin: 3px 0; }
  .prods .barra { position: absolute; inset: 0 auto 0 0; background: rgba(143,211,182,.09); border-radius: 4px; z-index: 0; }
  .prods .p-nome, .prods .p-val { position: relative; z-index: 1; }
  .prods .p-nome { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .prods .p-val { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .news { list-style: none; margin: 0; padding: 0; }
  .news li { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .news li:last-child { border-bottom: 0; }
  .news a { text-decoration: none; font: 500 16.5px/1.35 "Source Serif 4", Georgia, serif; }
  .news a:hover { color: var(--accent); }
  .news span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .sinais { list-style: none; margin: 10px 0 4px; padding: 0; display: grid; gap: 8px; }
  .sinais li { display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; line-height: 1.4; }
  .sinais i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #6d7980; transform: translateY(1px); }
  .sinais .conv i { background: var(--accent); } .sinais .div i, .sinais .atr i { background: #d98b7a; }
  .escala { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin: 16px 0 8px; }
  .escala b { position: absolute; top: -6px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
  .escala u { position: absolute; top: -3px; width: 1px; height: 12px; background: var(--muted); }
  .escala-leg { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
  .disputas { list-style: none; margin: 6px 0 0; padding: 0; }
  .disputas li { padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .disputas li:last-child { border-bottom: 0; }
  .disputas a { font-weight: 500; text-decoration: none; } .disputas a:hover { color: var(--accent); }
  .disputas span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .erro { position: absolute; inset: 0; z-index: 1; display: none; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }
  .erro.on { display: grid; }

  @media (max-width: 980px) {
    .barra { flex-wrap: wrap; gap: 10px 16px; padding: 12px 16px; }
    .marca span { display: none; }
    .estado { order: 3; width: 100%; }
    .busca input { width: 170px; }
    .quadro { margin: 12px 16px 24px; grid-template-columns: 1fr; height: auto; }
    .lado-globo { height: 56vh; min-height: 360px; border-right: 0; border-bottom: 1px solid var(--rule); }
    .lado-texto { overflow: visible; }
    .pane-topo { padding: 14px 14px; }
    .titulo-globo { display: none; }
    .modos .longo { display: none; }
    .legenda { left: 14px; bottom: 14px; }
    .zoom { right: 14px; bottom: 14px; }
    .lista ol { columns: 1; }
    .lista { padding: 64px 16px 16px; }
    .cab { padding: 24px 18px 0; } .cab h2 { font-size: 32px; }
    .abas-topo, .filtros, .regra { margin-left: 18px; margin-right: 18px; }
    .abas-topo { gap: 20px; overflow-x: auto; }
    .abas-topo button { white-space: nowrap; }
    .corpo { padding: 6px 18px; } .rodape { padding: 18px 18px 24px; }
    .painel header { position: relative; padding: 22px 18px 14px; } .painel h2 { font-size: 30px; }
    .fechar { top: 20px; right: 16px; }
    .bloco { padding: 20px 18px; } .nota { padding: 16px 18px 24px; }
  }
  @media (prefers-reduced-motion: reduce) { body.aberto .painel { animation: none; } }
</style>
</head>
<body>
<header class="barra">
  <a class="marca" href="../" title="Voltar ao rotzx">rotzx<span>O mundo visto do Brasil</span></a>
  <div class="estado" id="estado" aria-live="polite"></div>
  <div class="busca">
    <input id="busca" list="paises" placeholder="Buscar país…" aria-label="Buscar país" autocomplete="off">
    <datalist id="paises"></datalist>
  </div>
</header>

<main class="quadro">
  <section class="lado-globo" aria-label="Globo">
    <div id="globo" aria-label="Globo interativo"></div>
    <div class="lista" id="lista" aria-label="Lista de países"></div>
    <div class="pane-topo">
      <div class="titulo-globo">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="9.5" stroke="var(--accent)" stroke-width="1.2"/><circle cx="11" cy="11" r="5.5" stroke="var(--accent)" stroke-width="1.2"/></svg>
        Visão mundial
      </div>
      <button class="voltar" id="voltar" type="button" aria-label="Voltar ao mundo"><span aria-hidden="true">←</span> Mundo</button>
      <div class="modos" role="group" aria-label="Modo de visualização">
        <button type="button" data-modo="globo" aria-pressed="true">Globo</button>
        <button type="button" data-modo="lista" aria-pressed="false">Lista<span class="longo"> de países</span></button>
      </div>
    </div>
    <div class="legenda" aria-hidden="true">
      <span><i style="background:var(--base-solid)"></i>Brasil</span>
      <span><i style="background:var(--focus-solid)"></i>Com dados (20 países)</span>
    </div>
    <div class="zoom"><button type="button" id="mais" aria-label="Aproximar">+</button><button type="button" id="menos" aria-label="Afastar">−</button></div>
    <div class="erro" id="erro"><div><b>Não foi possível carregar o globo.</b><br>Seu navegador precisa de WebGL. Use a lista de países ou tente outro navegador.</div></div>
  </section>
  <section class="lado-texto" id="conteudo">
    <div class="resumo-mundo" id="resumo" aria-label="Resumo"></div>
    <div class="painel" id="painel" aria-live="polite" aria-label="Detalhes do país"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="dados/mundo.js"></script>
<script src="dados/noticias.js"></script>
<script>
"use strict";
// Países do protótipo: o Brasil (base) e 20 parceiros escolhidos para testar a navegação.
// A lista final virá dos dados de comércio exterior (Comex Stat), não desta escolha.
// id = código numérico ISO 3166-1 do mapa (Natural Earth via world-atlas); lat/lng/alt = enquadramento da câmera.
const FOCO = {
  "076": { nome: "Brasil", lat: -14, lng: -52, alt: 1.25, base: true },
  "156": { nome: "China", lat: 35, lng: 104, alt: 1.3 },
  "840": { nome: "Estados Unidos", lat: 39, lng: -98, alt: 1.35 },
  "032": { nome: "Argentina", lat: -37, lng: -64, alt: 1.0 },
  "528": { nome: "Países Baixos", lat: 52.2, lng: 5.3, alt: 0.45 },
  "724": { nome: "Espanha", lat: 40, lng: -3.7, alt: 0.65 },
  "276": { nome: "Alemanha", lat: 51, lng: 10, alt: 0.6 },
  "484": { nome: "México", lat: 23, lng: -102, alt: 0.9 },
  "152": { nome: "Chile", lat: -35, lng: -71, alt: 1.1 },
  "392": { nome: "Japão", lat: 36, lng: 138, alt: 0.75 },
  "356": { nome: "Índia", lat: 22, lng: 79, alt: 1.0 },
  "380": { nome: "Itália", lat: 42.5, lng: 12.5, alt: 0.6 },
  "410": { nome: "Coreia do Sul", lat: 36.4, lng: 127.8, alt: 0.45 },
  "124": { nome: "Canadá", lat: 58, lng: -100, alt: 1.45 },
  "250": { nome: "França", lat: 46.5, lng: 2.5, alt: 0.65 },
  "600": { nome: "Paraguai", lat: -23.4, lng: -58.4, alt: 0.6 },
  "643": { nome: "Rússia", lat: 60, lng: 95, alt: 1.7 },
  "682": { nome: "Arábia Saudita", lat: 24, lng: 45, alt: 0.85 },
  "826": { nome: "Reino Unido", lat: 54, lng: -2.5, alt: 0.6 },
  "170": { nome: "Colômbia", lat: 4.6, lng: -74, alt: 0.75 },
  "858": { nome: "Uruguai", lat: -32.8, lng: -56, alt: 0.45 },
};
const ABAS = ["Economia", "Política", "Geopolítica", "Afeta o mundo"];
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $painel = document.getElementById("painel"), $voltar = document.getElementById("voltar");

let globo, paises = [], selecionado = null, sobre = null;
const nomeDe = (f) => FOCO[f.id]?.nome || f.properties.name;  // fora do protótipo: nome em inglês do mapa

function cor(f) {
  if (f === selecionado) return css("--sel");
  const foco = FOCO[f.id];
  if (f === sobre) return foco ? (foco.base ? css("--base-hover") : css("--focus-hover")) : css("--land-hover");
  return foco ? (foco.base ? css("--base") : css("--focus")) : css("--land");
}
const BRASIL = { lat: -12, lng: -50, altitude: 2.35 };  // vista inicial: o Brasil de frente, a Terra inteira no quadro
const TEXTURAS = "https://cdn.jsdelivr.net/npm/three-globe@2.45.6/example/img/";  // Blue Marble (NASA) e relevo

function vazio(texto) {
  return `<div class="vazio"><div class="linhas" aria-hidden="true"><div></div><div></div><div></div></div>${esc(texto)}</div>`;
}

// ---------- dados (window.MUNDO e window.NOTICIAS, gerados por `rotzx mundo-atualizar`) ----------
// Dados: a cópia que veio com o site (dados/*.js) e, se der, a versão mais nova do repositório público,
// que o robô diário (workflow Globo) atualiza. Assim as manchetes ficam frescas sem republicar o site.
let M = window.MUNDO || null, N = window.NOTICIAS || null;
const REPO_DADOS = "https://raw.githubusercontent.com/lcgalera/rotzx/main/prototipos/globo/dados/";
async function dadosFrescos() {
  const pegar = async (nome) => { const r = await fetch(REPO_DADOS + nome + ".json", { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); return r.json(); };
  const [m, n] = await Promise.allSettled([pegar("mundo"), pegar("noticias")]);
  let mudou = false;
  if (m.status === "fulfilled" && (!M || m.value.gerado_em > M.gerado_em)) { M = m.value; mudou = true; }
  if (n.status === "fulfilled" && (!N || n.value.gerado_em > N.gerado_em)) { N = n.value; mudou = true; }
  if (mudou) { renderEstado(); renderResumo(); renderLista(); if (selecionado) renderPainel(selecionado); }
}
const NOMES_CAT = { economia: "Economia", politica: "Política", geopolitica: "Geopolítica", afeta_o_mundo: "Afeta o mundo" };
const bi = (v) => "US$ " + (v / 1e9).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " bi";
const pct = (v, c = 1) => (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c }) + "%";
const num = (v, c = 1) => v.toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const dataBR = (d) => (d && d.length >= 8 ? `${d.slice(6, 8)}/${d.slice(4, 6)}/${d.slice(0, 4)}` : "");
const quando = (iso) => (iso ? new Date(iso).toLocaleDateString("pt-BR") : "");

function fonte(chave, extra = "") {
  const f = M?.fontes?.[chave] || N?.fonte;
  if (!f) return "";
  return `<p class="fonte">Fonte: <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nome)}</a>${f.licenca ? ` (${esc(f.licenca)})` : ""}${extra ? " · " + esc(extra) : ""}</p>`;
}

function tabelaProdutos(lista, titulo) {
  if (!lista?.length) return "";
  const max = Math.max(...lista.map((x) => x.participacao));
  return `<div class="kicker" style="margin:12px 0 6px">${esc(titulo)}</div><ol class="prods">${lista.map((x) => `
    <li><div class="barra" style="width:${(x.participacao / max) * 100}%"></div>
      <span class="p-nome" title="SH4 ${esc(x.sh4)}">${esc(x.produto)}</span><span class="p-val">${bi(x.fob)} · ${pct(x.participacao)}</span></li>`).join("")}</ol>`;
}

function blocoComercio(d) {
  const c = d.comercio;
  if (!c) return `<div class="bloco"><h3>Relação com o Brasil</h3>${vazio("Sem dados de comércio para este país.")}</div>`;
  const kpi = (r, v, s = "") => `<div class="kpi"><span>${esc(r)}</span><b>${v}</b>${s ? `<small>${esc(s)}</small>` : ""}</div>`;
  return `<div class="bloco"><h3>Relação com o Brasil</h3>${fonte("comex", `${M.ano_comercio}, valores FOB`)}
    <p class="resumo">${esc(d.resumo)}</p>
    <div class="kpis">
      ${c.exportacao ? kpi("Brasil exportou", bi(c.exportacao.fob), `${c.exportacao.posicao}º destino`) : ""}
      ${c.importacao ? kpi("Brasil importou", bi(c.importacao.fob), `${c.importacao.posicao}º fornecedor`) : ""}
      ${c.saldo != null ? kpi("Saldo", (c.saldo >= 0 ? "+" : "−") + bi(Math.abs(c.saldo)), c.saldo >= 0 ? "superávit" : "déficit") : ""}
    </div>
    ${tabelaProdutos(c.produtos_exportados, "O que o Brasil mais vende")}
    ${tabelaProdutos(c.produtos_importados, "O que o Brasil mais compra")}</div>`;
}

// ---- Relação com o Brasil além do comércio (D42): votos na ONU e disputas na OMC. Só fatos medidos, com fonte. ----
function nomeOMC(cod) {
  if (cod === "EEC") return "União Europeia";
  if (cod === "BRA") return "Brasil";
  const p = Object.values(M?.paises || {}).find((x) => x.iso3 === cod);
  return p ? p.nome : cod;   // fora dos 20: o código da OMC (ISO 3166)
}
const ano = (iso) => (iso || "").slice(0, 4);

function faixaONU(o) {   // terço da tabela de concordância com o Brasil, entre todos os países com votos no ano
  const t = o.posicao / o.de;
  return t <= 1 / 3 ? ["conv", "entre o terço que mais vota igual ao Brasil"] : t > 2 / 3 ? ["div", "entre o terço que menos vota igual ao Brasil"] : ["neu", "no meio da tabela"];
}

function sinais(d) {
  const r = d.relacoes || {}, c = d.comercio, o = r.onu, w = r.omc, l = [];
  if (c?.saldo != null) l.push(["neu", `Comércio: ${c.saldo >= 0 ? "superávit" : "déficit"} brasileiro de ${bi(Math.abs(c.saldo))} em ${esc(M.ano_comercio)}`]);
  if (o) { const [k, t] = faixaONU(o); l.push([k, `Votos na ONU: ${t} (${o.posicao}º de ${o.de} em ${esc(M.onu?.ano)})`]); }
  if (w) {
    // "Recente" e não "em aberto": casos antigos muitas vezes nunca recebem encerramento formal na OMC
    const rec = w.com_brasil.filter((x) => +ano(x.inicio) >= w.recentes_desde).length, tot = w.com_brasil.length;
    const ue = w.via_ue ? " (via União Europeia)" : "";
    l.push([rec ? "atr" : "neu", rec ? `OMC: ${rec} disputa${rec > 1 ? "s" : ""} com o Brasil aberta${rec > 1 ? "s" : ""} desde ${w.recentes_desde}${ue}; ${tot} desde 1995`
      : `OMC: nenhuma disputa com o Brasil desde ${w.recentes_desde}${ue}${tot ? `; ${tot} desde 1995` : ""}`]);
  }
  return l.length ? `<ul class="sinais">${l.map(([k, t]) => `<li class="${k}"><i></i><span>${t}</span></li>`).join("")}</ul>` : "";
}

function linhaDisputa(x, eu) {
  const quem = x.lado === "reclamante" ? `${esc(eu)} abriu contra ${x.contra.map(nomeOMC).map(esc).join(", ")}` : `${x.reclamantes.map(nomeOMC).map(esc).join(", ")} abriu contra ${esc(eu)}`;
  return `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titulo)}</a>
    <span>${esc(x.ds)} · ${ano(x.inicio)} · ${quem} · ${esc(x.situacao)}</span></li>`;
}

function blocoRelacoes(d, nome) {
  const r = d.relacoes || {}, o = r.onu, w = r.omc;
  if (!o && !w) return "";
  const eu = w?.via_ue ? "União Europeia" : nome;
  let h = `<div class="bloco"><h3>Sinais da relação</h3><p class="fonte">Medidas, não opinião: cada linha diz de onde vem.</p>${sinais(d)}`;
  if (o) {
    h += `<div class="kicker" style="margin:16px 0 6px">Votos na Assembleia Geral da ONU</div>${fonte("onu", `${M.onu?.ano}`)}
      <p class="resumo">Concordância com o Brasil em ${esc(M.onu?.ano)}: <b>${Math.round(o.concordancia * 100)} de 100</b>
        (média ${esc(o.anos_media)}: ${Math.round(o.media * 100)}). ${o.posicao}º entre ${o.de} países.</p>
      <div class="escala" role="img" aria-label="Posição na escala de concordância"><u style="left:${M.onu.mediana * 100}%" title="mediana dos países"></u><b style="left:${o.concordancia * 100}%"></b></div>
      <div class="escala-leg"><span>0 · votam sempre ao contrário</span><span>traço fino = mediana</span><span>100 · votam igual</span></div>
      <p class="fonte" style="margin-top:8px">1 voto igual vale 1; abstenção de um dos dois vale meio. Muda com a pauta do ano, por isso a média de 5 anos.</p>`;
  }
  if (w) {
    const cb = w.com_brasil;
    h += `<div class="kicker" style="margin:16px 0 6px">Disputas comerciais com o Brasil na OMC</div>${fonte("omc", "títulos oficiais em inglês")}
      ${w.via_ue ? `<p class="fonte">Na OMC, os países da União Europeia são representados pela UE: as disputas abaixo são da UE.</p>` : ""}
      ${cb.length ? `<ul class="disputas">${cb.slice(0, 5).map((x) => linhaDisputa(x, eu)).join("")}</ul>${cb.length > 5 ? `<p class="fonte">e mais ${cb.length - 5} desde 1995.</p>` : ""}`
        : vazio("Nenhuma disputa com o Brasil na OMC desde 1995.")}`;
    h += blocoExterno(w, eu);
  }
  return h + "</div>";
}

// Visão externa: com quem o país disputa na OMC, sem o Brasil no meio
function blocoExterno(w, eu) {
  const cp = Object.entries(w.contrapartes || {});
  return `<div class="kicker" style="margin:16px 0 6px">Visão externa: disputas com outros países desde ${w.recentes_desde}</div>
    ${w.recentes_total ? `<p class="resumo">${w.recentes_total} disputa${w.recentes_total > 1 ? "s" : ""}; com quem: ${cp.slice(0, 5).map(([k, n]) => `${esc(nomeOMC(k))} (${n})`).join(", ")}${cp.length > 5 ? " e outros" : ""}.</p>
      <ul class="disputas">${w.recentes.slice(0, 3).map((x) => linhaDisputa(x, eu)).join("")}</ul>` : vazio(`Nenhuma disputa na OMC desde ${w.recentes_desde}.`)}`;
}

// ---- Conflitos armados (D43): UCDP/PRIO, só o que a base mede (25+ mortes em combate no ano, um governo de um dos lados) ----
const versaoUCDP = () => (M?.conflitos?.versao || "").replace(/^(\d\d)(\d)$/, "$1.$2");
const contra = (c) => `${c.lado_a.map(esc).join(", ")} × ${c.lado_b.map(esc).join(", ")}`;
function linhaConflito(c, doPais) {
  const anos = doPais ? c.anos_pais : c.anos;
  const periodo = (doPais ? "participação: " : "") + (anos.length > 1 ? `${anos[0]}–${anos[anos.length - 1]}` : `${anos[0]}`);
  let papel = "";
  if (doPais) {
    papel = c.papel === "apoio com tropas"
      ? `apoio com tropas a ${c.apoia.map(esc).join(", ")}${c.apoiadores_no_lado > 5 ? ` (um entre ${c.apoiadores_no_lado} países desse lado: a base inclui tropas de missões multinacionais, como as de paz da ONU)` : ""}`
      : c.papel === "lado principal" ? "lado principal" : "no território do país";
  }
  return `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.local)}: ${contra(c)}</a>
    <span>${papel ? papel + " · " : ""}${esc(c.tipo)} · disputa por ${esc(c.disputa)}${c.territorio ? ` (${esc(c.territorio)})` : ""} · ${periodo}
      ${c.ultimo_ano === M.conflitos.ultimo_ano ? ` · ${doPais ? "o conflito " : ""}em ${c.ultimo_ano}: ${c.guerra_no_ultimo_ano ? "<b>1.000 ou mais mortes em combate</b>" : "25 a 999 mortes em combate"}` : ""}</span></li>`;
}

function blocoConflitos(d) {
  const l = d.relacoes?.conflitos;
  if (!l || !M?.conflitos) return "";
  const k = M.conflitos;
  return `<div class="bloco"><h3>Conflitos armados, ${k.desde}–${k.ultimo_ano}</h3>${fonte("ucdp", `versão ${versaoUCDP()}`)}
    ${l.length ? `<ul class="disputas">${l.slice(0, 6).map((c) => linhaConflito(c, true)).join("")}</ul>${l.length > 6 ? `<p class="fonte">e mais ${l.length - 6} no período.</p>` : ""}`
      : vazio(`Nenhum conflito armado registrado de ${k.desde} a ${k.ultimo_ano}.`)}
    <p class="fonte" style="margin-top:10px">Conta só conflitos em que um dos lados é um governo e que deixaram 25 ou mais mortes em combate no ano.
      Nomes como na base, em inglês.</p></div>`;
}

function blocoEconomia(d) {
  const e = d.economia || [];
  if (!e.length) return `<div class="bloco"><h3>Economia</h3>${vazio("Sem indicadores do Banco Mundial para este país.")}</div>`;
  const fmt = (x) => x.id === "NY.GDP.MKTP.CD" ? "US$ " + num(x.valor / 1e12, 2) + " tri"
    : x.id === "SP.POP.TOTL" ? num(x.valor / 1e6, 1) + " mi" : (x.valor >= 0 ? "" : "−") + num(Math.abs(x.valor), 1) + "%";
  return `<div class="bloco"><h3>Economia</h3>${fonte("bancomundial", `atualizado em ${e[0].atualizado || "–"}`)}
    <div class="kpis">${e.map((x) => `<div class="kpi"><span>${esc(x.rotulo)}</span><b>${fmt(x)}</b><small>${esc(x.ano)}</small></div>`).join("")}</div></div>`;
}

function listaManchetes(lista, cat) {
  const l = cat === "todas" ? lista : lista.filter((m) => m.categorias.includes(cat));
  if (!l.length) return vazio(cat === "todas" ? "Nenhuma manchete em português nos últimos 7 dias." : `Nenhuma manchete de ${NOMES_CAT[cat].toLowerCase()} nos últimos 7 dias.`);
  return `<ul class="news">${l.slice(0, 12).map((m) => `<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.titulo)}</a>
    <span>${esc(m.veiculo)} · ${dataBR(m.data)}${m.categorias.length ? " · " + m.categorias.map((c) => NOMES_CAT[c]).join(", ") : ""}</span></li>`).join("")}</ul>`;
}

function blocoManchetes(lista, titulo, nota) {
  const abas = [["todas", "Todas"], ...Object.entries(NOMES_CAT)];
  return `<div class="bloco"><h3>${esc(titulo)}</h3>
    <p class="fonte">Fontes: feeds RSS de veículos em português e <a href="https://www.gdeltproject.org" target="_blank" rel="noopener">GDELT</a> · ${esc(nota)} · atualizado em ${quando(N?.gerado_em)}</p>
    <div class="abas" role="tablist">${abas.map(([k, r], i) => `<button role="tab" aria-selected="${i === 0}" data-aba="${k}">${esc(r)}</button>`).join("")}</div>
    <div class="aba-corpo">${listaManchetes(lista, "todas")}</div>
    <p class="fonte" style="margin-top:8px">Categorias atribuídas automaticamente por palavras-chave no título; podem errar.</p></div>`;
}

function painelPais(f) {
  const foco = FOCO[f.id];
  const nome = nomeDe(f);
  const d = M?.paises?.[f.id];
  const rodape = `<p class="nota">Protótipo. ${M ? `Comércio de ${esc(M.ano_comercio)}; dados coletados em ${quando(M.gerado_em)}.` : "Dados ainda não gerados (rode rotzx mundo-atualizar)."}
    Manchetes: só título, veículo e link; o texto está no site de cada veículo.</p>`;
  if (foco?.base) {
    const t = d?.comercio_total, r = d?.maiores_parceiros || [];
    const max = r.length ? Math.max(...r.map((x) => x.exportacao + x.importacao)) : 1;
    return `<header><button class="fechar" aria-label="Fechar">×</button><div class="kicker">Ponto de vista</div><h2>Brasil</h2>
      <p class="sub">A base de tudo: cada país é lido pela relação com o Brasil.</p></header>
      <div class="bloco"><h3>Comércio exterior do Brasil</h3>${t ? fonte("comex", `${M.ano_comercio}, valores FOB`) + `
        <div class="kpis"><div class="kpi"><span>Exportações</span><b>${bi(t.exportacao)}</b></div><div class="kpi"><span>Importações</span><b>${bi(t.importacao)}</b></div>
        <div class="kpi"><span>Saldo</span><b>${t.saldo >= 0 ? "+" : "−"}${bi(Math.abs(t.saldo))}</b></div></div>
        <div class="kicker" style="margin:12px 0 6px">Maiores parceiros (exportação + importação)</div>
        <ol class="prods">${r.map((x) => `<li><div class="barra" style="width:${((x.exportacao + x.importacao) / max) * 100}%"></div>
          <span class="p-nome">${esc(x.pais)}</span><span class="p-val">${bi(x.exportacao + x.importacao)}</span></li>`).join("")}</ol>` : vazio("Dados ainda não gerados.")}</div>
      ${d ? blocoEconomia(d) : ""}
      ${d?.relacoes?.omc ? `<div class="bloco"><h3>Disputas do Brasil na OMC</h3>${fonte("omc", "títulos oficiais em inglês")}
        <p class="resumo">${d.relacoes.omc.total} disputas desde 1995, como reclamante ou demandado.</p>${blocoExterno(d.relacoes.omc, "Brasil")}</div>` : ""}
      ${d ? blocoConflitos(d) : ""}
      ${N ? blocoManchetes(N.mundo || [], "Em alta no mundo", "manchetes em português dos últimos 2 dias sobre geopolítica e temas globais (seleção por palavras-chave)") : ""}
      ${rodape}`;
  }
  if (!foco) {
    return `<header><button class="fechar" aria-label="Fechar">×</button><div class="kicker">Fora do protótipo</div><h2>${esc(nome)}</h2>
      <p class="sub">Este país entra depois dos 20 do protótipo.</p></header><div class="bloco">${vazio("Sem dados no protótipo.")}</div>${rodape}`;
  }
  return `<header><button class="fechar" aria-label="Fechar">×</button><div class="kicker">Visto do Brasil</div><h2>${esc(nome)}</h2>
    <p class="sub">Relação com o Brasil, economia e o que está acontecendo.</p></header>
    ${d ? blocoComercio(d) + blocoRelacoes(d, nome) + blocoConflitos(d) + blocoEconomia(d) : `<div class="bloco">${vazio("Dados ainda não gerados.")}</div>`}
    ${N ? blocoManchetes(N.paises?.[f.id] || [], "Manchetes", "manchetes em português dos últimos 7 dias que citam o país no título") : ""}
    <div class="bloco"><span class="selo">interpretação · em breve</span><h3>Por que importa para o Brasil</h3>
      <p class="fonte">Texto curto, com a fonte de cada número; o que for interpretação vai aparecer marcado</p>${vazio("Ainda não escrito.")}</div>
    ${rodape}`;
}

// ---------- barra de cima: de quando são os dados e se as fontes responderam ----------
const hora = (iso) => (iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "");
const LEIAME = "https://github.com/lcgalera/rotzx/blob/main/prototipos/globo/LEIAME.md";
function renderEstado() {
  const falhas = Object.keys(N?.falhas || {}).filter((k) => k.startsWith("rss:")).length;
  const partes = [];
  if (N?.gerado_em) partes.push(`manchetes de ${hora(N.gerado_em)}`);
  if (M?.ano_comercio) partes.push(`comércio ${esc(M.ano_comercio)}`);
  if (M?.onu?.ano) partes.push(`votos na ONU ${esc(M.onu.ano)}`);
  if (M?.fontes?.omc) partes.push("disputas na OMC");
  if (M?.conflitos) partes.push(`conflitos ${M.conflitos.ultimo_ano}`);
  const ok = N && !falhas;
  document.getElementById("estado").innerHTML = `<i class="ponto${ok ? "" : " aviso"}"></i>
    <b>${N ? (falhas ? `${falhas} fonte${falhas > 1 ? "s" : ""} sem resposta` : "Dados abertos") : "Coleta indisponível"}</b>
    <span class="txt">${partes.join(" · ") || "nenhum dado carregado"}</span>
    <a href="${LEIAME}" target="_blank" rel="noopener">Fontes e método ↗</a>`;
}

// ---------- coluna da direita, sem país aberto: "Mundo agora" ----------
let aba = "agora", filtro = "todas";
const ABAS_RESUMO = [["agora", "Agora"], ["brasil", "No Brasil"], ["conflitos", "Conflitos"], ["comercio", "Comércio do Brasil"]];
const FILTROS = [["todas", "Todas"], ...Object.entries(NOMES_CAT)];

function listaDaAba() { return aba === "brasil" ? (N?.paises?.["076"] || []) : (N?.mundo || []); }

function corpoManchetes() {
  const todas = [...listaDaAba()].sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  const l = filtro === "todas" ? todas : todas.filter((m) => m.categorias.includes(filtro));
  const conta = (k) => (k === "todas" ? todas.length : todas.filter((m) => m.categorias.includes(k)).length);
  const janela = aba === "brasil" ? "7 dias" : "2 dias";
  const corpo = l.length
    ? `<ul class="manchetes">${l.slice(0, 15).map((m) => `<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.titulo)}</a>
        <span>${esc(m.veiculo)} · ${dataBR(m.data)}${m.categorias.length ? " · " + m.categorias.map((c) => NOMES_CAT[c]).join(", ") : ""}</span></li>`).join("")}</ul>`
    : `<div class="nada"><h3>Nada nesta seleção</h3>
        <p>Nenhuma manchete${filtro === "todas" ? "" : " de " + NOMES_CAT[filtro].toLowerCase()} nos últimos ${janela}. Isso não quer dizer que nada aconteceu:
        a coleta lê só os títulos de nove veículos em português.</p>${filtro === "todas" ? "" : `<button class="botao" type="button" data-limpar>Ver todas</button>`}</div>`;
  return `<div class="filtros" role="group" aria-label="Categorias">${FILTROS.map(([k, r]) => `<button type="button" data-filtro="${k}" aria-pressed="${k === filtro}">${esc(r)}<small>${conta(k)}</small></button>`).join("")}</div>
    <p class="regra">Mais recentes primeiro, sem ranking de importância. ${aba === "brasil" ? "Manchetes que citam o Brasil no título." : "Geopolítica e temas que afetam o mundo."}
      Categorias por palavras-chave no título; podem errar.</p>
    <div class="corpo">${corpo}</div>`;
}

function corpoConflitos() {
  const k = M?.conflitos;
  if (!k) return `<div class="corpo"><div class="nada"><h3>Sem dados de conflitos</h3><p>A coleta da base de Uppsala ainda não rodou.</p></div></div>`;
  const a = k.mundo.ativos;
  return `<div class="corpo" style="padding-top:22px">${fonte("ucdp", `versão ${versaoUCDP()}`)}
    <div class="kpis"><div class="kpi"><span>Conflitos armados em ${k.ultimo_ano}</span><b>${k.mundo.total}</b></div>
      <div class="kpi"><span>Com 1.000 ou mais mortes em combate</span><b>${k.mundo.guerras}</b></div></div>
    <p class="regra" style="margin:14px 0 0">Os mais intensos primeiro, depois por lugar. Só conflitos com um governo de um dos lados e 25 ou mais mortes
      em combate no ano; protestos e crises sem combate não entram. Nomes como na base, em inglês.</p>
    <ul class="disputas" style="margin-top:8px">${a.map((c) => linhaConflito(c, false)).join("")}</ul></div>`;
}

function corpoComercio() {
  const b = M?.paises?.["076"], t = b?.comercio_total;
  if (!t) return `<div class="corpo"><div class="nada"><h3>Sem dados de comércio</h3><p>Rode <code>rotzx mundo-atualizar</code>.</p></div></div>`;
  const porNome = Object.fromEntries(Object.entries(FOCO).map(([id, p]) => [p.nome, id]));
  porNome["Países Baixos (Holanda)"] = "528";
  const top = (b.maiores_parceiros || []).slice(0, 8);
  const max = Math.max(...top.map((x) => x.exportacao + x.importacao));
  return `<div class="corpo" style="padding-top:22px">${fonte("comex", `${M.ano_comercio}, valores FOB`)}
    <div class="kpis"><div class="kpi"><span>Exportou</span><b>${bi(t.exportacao)}</b></div><div class="kpi"><span>Importou</span><b>${bi(t.importacao)}</b></div>
      <div class="kpi"><span>Saldo</span><b>${t.saldo >= 0 ? "+" : "−"}${bi(Math.abs(t.saldo))}</b></div></div>
    <div class="kicker secao">Maiores parceiros · exportação + importação</div>
    <ol class="parceiros">${top.map((x) => { const id = porNome[x.pais];
      return `<li><button type="button" ${id ? `data-id="${id}"` : "disabled"}><span class="barra" style="width:${((x.exportacao + x.importacao) / max) * 100}%"></span>
        <span>${esc(x.pais)}</span><span class="p-val">${bi(x.exportacao + x.importacao)}</span></button></li>`; }).join("")}</ol></div>`;
}

function renderResumo() {
  const $r = document.getElementById("resumo");
  $r.innerHTML = `<div class="cab"><div class="kicker">Seu ponto de partida</div><h2>Mundo agora</h2>
      <p class="sub">O que está acontecendo e como chega ao Brasil. Clique num país para ver a relação dele com o Brasil.</p></div>
    <div class="abas-topo" role="tablist">${ABAS_RESUMO.map(([k, r]) => `<button type="button" role="tab" data-aba="${k}" aria-selected="${k === aba}">${esc(r)}</button>`).join("")}</div>
    ${aba === "comercio" ? corpoComercio() : aba === "conflitos" ? corpoConflitos() : corpoManchetes()}
    <div class="rodape"><i class="ponto${N ? "" : " aviso"}"></i>${N ? `Última coleta de manchetes: ${hora(N.gerado_em)}` : "Nenhuma coleta de manchetes carregada"} · imagem do planeta: Blue Marble (NASA)</div>`;
  $r.querySelectorAll("[data-aba]").forEach((b) => (b.onclick = () => { aba = b.dataset.aba; filtro = "todas"; renderResumo(); }));
  $r.querySelectorAll("[data-filtro]").forEach((b) => (b.onclick = () => { filtro = b.dataset.filtro; renderResumo(); }));
  $r.querySelectorAll("[data-limpar]").forEach((b) => (b.onclick = () => { filtro = "todas"; renderResumo(); }));
  $r.querySelectorAll(".parceiros button[data-id]").forEach((bt) => (bt.onclick = () => {
    const f = paises.find((x) => x.id === bt.dataset.id);
    if (f) abrir(f);
  }));
}

// ---------- lista de países (alternativa ao globo; funciona também sem WebGL) ----------
function renderLista() {
  const tot = (id) => { const c = M?.paises?.[id]?.comercio; return c ? (c.exportacao?.fob || 0) + (c.importacao?.fob || 0) : 0; };
  const ids = Object.keys(FOCO).filter((id) => !FOCO[id].base).sort((a, b) => tot(b) - tot(a));
  document.getElementById("lista").innerHTML = `<p class="nota-lista">Países com dados, do maior para o menor comércio com o Brasil em ${esc(M?.ano_comercio || "")}.</p>
    <ol><li><button type="button" data-id="076">Brasil<span>ponto de vista</span></button></li>
    ${ids.map((id) => `<li><button type="button" data-id="${id}">${esc(FOCO[id].nome)}<span>${tot(id) ? bi(tot(id)) : "–"}</span></button></li>`).join("")}</ol>`;
  document.querySelectorAll("#lista button[data-id]").forEach((b) => (b.onclick = () => {
    const f = paises.find((x) => x.id === b.dataset.id) || { id: b.dataset.id, properties: { name: FOCO[b.dataset.id].nome } };
    modo("globo");
    abrir(f);
  }));
}

function modo(m) {
  if (m === "globo" && !globo) m = "lista";
  document.body.classList.toggle("modo-lista", m === "lista");
  document.querySelectorAll(".modos button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.modo === m));
}

function abrir(f) {
  selecionado = f;
  document.body.classList.add("aberto");
  const foco = FOCO[f.id];
  if (globo) {
    globo.polygonCapColor(cor).polygonAltitude((p) => (p === selecionado ? 0.03 : 0.006));
    globo.controls().autoRotate = false;
    globo.pointOfView(enquadrar(foco ? { lat: foco.lat, lng: foco.lng, altitude: foco.alt } : centro(f)), reduzir ? 0 : 1300);
  }
  renderPainel(f);
  document.getElementById("conteudo").scrollTop = 0;
  history.replaceState(null, "", `#${encodeURIComponent(nomeDe(f))}`);
}

function renderPainel(f) {
  $painel.innerHTML = painelPais(f);
  $painel.querySelector(".fechar").onclick = mundo;
  const lista = FOCO[f.id]?.base ? (N?.mundo || []) : (N?.paises?.[f.id] || []);
  $painel.querySelectorAll(".abas button").forEach((b) => (b.onclick = () => {
    $painel.querySelectorAll(".abas button").forEach((x) => x.setAttribute("aria-selected", x === b));
    b.closest(".bloco").querySelector(".aba-corpo").innerHTML = listaManchetes(lista, b.dataset.aba);
  }));
}

function mundo() {
  selecionado = null;
  document.body.classList.remove("aberto");
  if (globo) {
    globo.polygonCapColor(cor).polygonAltitude(0.006);
    globo.pointOfView(BRASIL, reduzir ? 0 : 1300);
    globo.controls().autoRotate = !reduzir;
  }
  document.getElementById("conteudo").scrollTop = 0;
  history.replaceState(null, "", location.pathname);
}

// O globo tem o lado dele do quadro: basta centralizar o país e afastar um pouco, para aparecer com os vizinhos.
function enquadrar(v) {
  return { lat: v.lat, lng: v.lng, altitude: v.altitude * 1.5 };
}

function ajustar() {
  if (!globo) return;
  const el = document.getElementById("globo");
  globo.width(el.clientWidth).height(el.clientHeight);
}

function zoom(fator) {
  if (!globo) return;
  const v = globo.pointOfView();
  globo.controls().autoRotate = false;
  globo.pointOfView({ ...v, altitude: Math.min(4, Math.max(0.25, v.altitude * fator)) }, reduzir ? 0 : 350);
}

// Enquadramento aproximado para países fora do protótipo: média dos vértices do maior polígono.
function centro(f) {
  const g = f.geometry;
  const aneis = g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map((p) => p[0]);
  const maior = aneis.sort((a, b) => b.length - a.length)[0];
  const lng = maior.reduce((s, c) => s + c[0], 0) / maior.length, lat = maior.reduce((s, c) => s + c[1], 0) / maior.length;
  return { lat, lng, altitude: 0.9 };
}

// Tinge a imagem de satélite de verde-petróleo escuro (sóbrio, mantendo o relevo). Quando a textura termina de carregar,
// a biblioteca zera a cor do material; por isso a cor volta depois, criada a partir de outra cor do próprio material.
function tingir() {
  const mat = globo.globeMaterial();
  mat.shininess = 0;                     // sem o reflexo branco do material padrão
  mat.specular.set("#000000");
  if ("bumpScale" in mat) mat.bumpScale = 6;
  if (!mat.map) return setTimeout(tingir, 250);
  mat.color = mat.specular.clone().set("#5a7b7e");
  mat.needsUpdate = true;
}

function iniciar(atlas) {
  paises = topojson.feature(atlas, atlas.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const el = document.getElementById("globo");
  globo = Globe()(el)
    .backgroundColor("rgba(0,0,0,0)")      // o fundo é o do quadro
    .globeImageUrl(TEXTURAS + "earth-blue-marble.jpg")
    .bumpImageUrl(TEXTURAS + "earth-topology.png")
    .showGraticules(true)
    .showAtmosphere(true).atmosphereColor("#7cc3b0").atmosphereAltitude(0.13)
    .polygonsData(paises)
    .polygonCapColor(cor)
    .polygonSideColor(() => "rgba(205,236,226,0.04)")
    .polygonStrokeColor(() => css("--stroke"))
    .polygonAltitude(0.006)
    .polygonsTransitionDuration(reduzir ? 0 : 300)
    .polygonLabel((f) => `<div class="tip"><b>${esc(nomeDe(f))}</b><span>${FOCO[f.id] ? "clique para abrir" : "fora do protótipo"}</span></div>`)
    .onPolygonHover((f) => { sobre = f; globo.polygonCapColor(cor); el.style.cursor = f ? "pointer" : "grab"; })
    .onPolygonClick((f) => abrir(f));
  tingir();
  globo.controls().autoRotate = !reduzir;
  globo.controls().autoRotateSpeed = 0.18;  // devagar: o Brasil continua à vista por bastante tempo
  globo.pointOfView(BRASIL);
  addEventListener("resize", ajustar);
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(el);
  ajustar();
}

function ligar() {
  renderEstado();
  renderResumo();
  renderLista();
  document.getElementById("paises").innerHTML = Object.values(FOCO).map((p) => `<option value="${esc(p.nome)}">`).join("");
  document.getElementById("busca").addEventListener("change", (e) => {
    const alvo = e.target.value.trim().toLowerCase();
    const f = paises.find((x) => nomeDe(x).toLowerCase() === alvo);
    if (f) { modo("globo"); abrir(f); e.target.blur(); }
  });
  $voltar.onclick = mundo;
  document.querySelectorAll(".modos button").forEach((b) => (b.onclick = () => modo(b.dataset.modo)));
  document.getElementById("mais").onclick = () => zoom(0.75);
  document.getElementById("menos").onclick = () => zoom(1.33);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && selecionado) mundo(); });
}

(async () => {
  ligar();   // o texto e a lista aparecem mesmo se o globo não carregar
  try {
    if (typeof Globe !== "function") throw new Error("biblioteca do globo não carregou");
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
    if (!r.ok) throw new Error("mapa não carregou");
    iniciar(await r.json());
  } catch (e) {
    console.error(e);
    // sem WebGL ou sem a biblioteca: a lista de países faz o papel do globo
    document.getElementById("erro").classList.add("on");
    document.body.classList.add("sem-globo");
    modo("lista");
  }
  const inicial = decodeURIComponent(location.hash.slice(1));
  const f0 = inicial && paises.find((x) => nomeDe(x) === inicial);
  if (f0) setTimeout(() => abrir(f0), 400);
  dadosFrescos().catch(() => {});  // sem rede para o GitHub: fica a cópia que veio com o site
})();
</script>
