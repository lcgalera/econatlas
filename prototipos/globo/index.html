<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rotzx — Como o Brasil se conecta ao mundo</title>
<meta name="description" content="Explore os parceiros comerciais do Brasil, descubra o que compramos e vendemos e acompanhe como essas relações mudaram desde 1997.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("rotzx-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* sem armazenamento: tema do sistema */ }</script>
<style>
  /* rotzx — atlas das relações comerciais do Brasil. Identidade editorial (D49): tema claro principal, linhas finas,
     serifa nos títulos e nas descobertas, sans nos textos e controles, números tabulares. Cores só por tokens. */
  :root {
    --bg: #F3F0E8; --surface: #FAF8F3; --ink: #222721; --ink-2: #464C45; --muted: #676B62;
    --rule: #D8D4C9; --rule-2: #BDB8AB; --accent: #385344; --accent-ink: #2C4436; --ochre: #A16D2F; --neg: #9A4A3A;
    --sel-bg: #E3E9E1; --hover: #ECE9E0; --warn: #8A5A12; --on-accent: #FAF8F3;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151916; --surface: #1C211D; --ink: #E9E6DE; --ink-2: #C3C2B8; --muted: #9C9D93;
      --rule: #343A34; --rule-2: #4A514A; --accent: #8DBA9F; --accent-ink: #A9D0B8; --ochre: #D7A465; --neg: #E19A88;
      --sel-bg: #26302A; --hover: #222823; --warn: #E0B45C; --on-accent: #151916; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151916; --surface: #1C211D; --ink: #E9E6DE; --ink-2: #C3C2B8; --muted: #9C9D93;
    --rule: #343A34; --rule-2: #4A514A; --accent: #8DBA9F; --accent-ink: #A9D0B8; --ochre: #D7A465; --neg: #E19A88;
    --sel-bg: #26302A; --hover: #222823; --warn: #E0B45C; --on-accent: #151916; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .kicker { font: 600 11.5px/1.3 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink); }
  .num, td, .val, .v, output { font-variant-numeric: tabular-nums lining-nums; }
  button { transition: background-color .15s, color .15s, border-color .15s; }

  /* bandeiras: tamanho fixo, borda fina; sem bandeira, um retângulo neutro */
  .flag { display: inline-block; width: 20px; height: 15px; flex: none; border-radius: 1.5px; object-fit: cover; vertical-align: -2px;
          background: var(--hover); box-shadow: 0 0 0 1px rgba(34,39,33,.16); }
  .flag.g { width: 40px; height: 30px; border-radius: 2px; vertical-align: -5px; }
  .flag.vazia { background: repeating-linear-gradient(135deg, var(--rule) 0 2px, transparent 2px 5px); }

  /* cabeçalho: marca, descrição, navegação essencial, busca, fontes, tema */
  .barra { display: flex; align-items: center; gap: 8px 22px; padding: 12px 32px; border-bottom: 1px solid var(--ink); background: var(--bg); }
  .marca { font: 600 27px/1 var(--serif); letter-spacing: -.02em; text-decoration: none; white-space: nowrap; }
  .marca-desc { margin: 0; padding-left: 16px; border-left: 1px solid var(--rule-2); font: 400 15px/1.25 var(--serif); font-style: italic; color: var(--ink-2); white-space: nowrap; }
  .nav { display: flex; gap: 2px; margin-left: auto; }
  .nav button, .fontes-link { border: 0; background: none; padding: 8px 10px; cursor: pointer; font-size: 14px; color: var(--ink-2); border-radius: 3px; white-space: nowrap; }
  .nav button:hover, .fontes-link:hover { color: var(--ink); background: var(--hover); }
  .nav button[aria-current="page"], .fontes-link[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
  .tema { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--rule-2); border-radius: 50%; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 15px; flex: none; }
  .tema:hover { color: var(--ink); border-color: var(--ink-2); }

  /* busca com sugestões (bandeira + nome) */
  .ac { position: relative; }
  .ac input { width: 240px; padding: 8px 12px; border-radius: 3px; border: 1px solid var(--rule-2); background: var(--surface); font-size: 14.5px; outline: none; }
  .ac input::placeholder { color: var(--muted); }
  .ac input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .ac ul { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; min-width: 260px; max-height: 340px; overflow-y: auto; margin: 0; padding: 4px;
           list-style: none; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 3px; box-shadow: 0 8px 24px rgba(34,39,33,.12); }
  .ac li { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 2px; cursor: pointer; font-size: 14.5px; }
  .ac li[aria-selected="true"], .ac li:hover { background: var(--sel-bg); }
  .ac li small { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* quadro: mapa à esquerda, leitura à direita; sem moldura, só uma linha */
  .quadro { display: grid; grid-template-columns: minmax(340px, 35fr) minmax(0, 65fr); height: max(640px, calc(100vh - 62px)); transition: grid-template-columns .2s ease; }
  .lado-mapa { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); background: var(--surface); }
  .mapa-topo { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
  .modos { display: flex; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; }
  .modos button { border: 0; background: transparent; padding: 6px 14px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .modos button + button { border-left: 1px solid var(--rule-2); }
  .modos button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .modos button:disabled { color: var(--muted); cursor: not-allowed; text-decoration: line-through; text-decoration-color: var(--rule-2); }
  .voltar { display: none; align-items: center; gap: 8px; margin-left: auto; padding: 6px 4px; border: 0; background: transparent; cursor: pointer; font-size: 14px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 4px; }
  .voltar:hover { color: var(--ink); }
  body.com-pais .voltar, body.com-vista .voltar { display: inline-flex; }
  .area { position: relative; flex: 1; min-height: 0; background: var(--surface); }
  #globo { position: absolute; inset: 0; }
  .zoom { position: absolute; right: 16px; top: 16px; z-index: 3; display: grid; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; background: var(--surface); }
  .zoom button { width: 38px; height: 36px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--ink-2); }
  .zoom button:hover { background: var(--hover); color: var(--ink); }
  .zoom button + button { border-top: 1px solid var(--rule-2); }
  .lista { position: absolute; inset: 0; z-index: 2; display: none; overflow-y: auto; padding: 16px 22px; background: var(--surface); }
  body.modo-lista .lista { display: block; }
  body.modo-lista .zoom { display: none; }
  .lista .rank button { grid-template-columns: 26px 20px minmax(0, 1fr) minmax(92px, auto); grid-template-rows: auto auto; row-gap: 5px; }
  .lista .rank .tr { grid-column: 3 / 4; grid-row: 2; }
  .lista .rank .val { grid-column: 4; grid-row: 1 / 3; }
  .aviso-3d { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-2); }
  .aviso-3d::before { content: "Lista"; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin-right: 8px; }
  .tip { background: var(--surface); border: 1px solid var(--rule-2); padding: 8px 11px; border-radius: 3px; font: 13.5px/1.4 var(--sans); color: var(--ink); box-shadow: 0 4px 14px rgba(34,39,33,.12); }
  .tip b { font-weight: 600; } .tip span { display: block; color: var(--ink-2); font-size: 12.5px; }

  /* controles do mapa: métrica, ano, legenda — funcionais, discretos */
  .controles { padding: 12px 20px 14px; border-top: 1px solid var(--rule); display: grid; gap: 10px; background: var(--surface); }
  .metricas { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; }
  .metricas button { border: 1px solid transparent; background: transparent; padding: 5px 8px; border-radius: 3px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .metricas button:hover { background: var(--hover); color: var(--ink); }
  .metricas button[aria-pressed="true"] { background: var(--sel-bg); color: var(--ink); border-color: var(--rule-2); font-weight: 600; }
  .metricas .sep { color: var(--muted); font-size: 12px; margin: 0 2px 0 6px; padding-left: 8px; border-left: 1px solid var(--rule); }
  .ano-linha { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; }
  .ano-linha button { width: 36px; height: 34px; border: 1px solid var(--rule-2); border-radius: 50%; background: transparent; cursor: pointer; font-size: 11px; color: var(--ink-2); }
  .ano-linha button:hover { border-color: var(--ink-2); color: var(--ink); }
  .ano-linha input[type=range] { width: 100%; accent-color: var(--accent); }
  .ano-linha output { font: 500 28px/1 var(--serif); min-width: 2.6em; text-align: right; }
  .anos-chips, .chips { display: flex; gap: 0; flex-wrap: wrap; }
  .anos-chips button, .chips button { padding: 5px 12px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 13.5px; color: var(--ink-2); margin: 0 -1px -1px 0; }
  .anos-chips button:first-child, .chips button:first-child { border-radius: 3px 0 0 3px; }
  .anos-chips button:last-child, .chips button:last-child { border-radius: 0 3px 3px 0; }
  .anos-chips button:hover, .chips button:hover { background: var(--hover); color: var(--ink); }
  .anos-chips button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); position: relative; }
  .chips { margin-top: 10px; }
  .chips.soltos { gap: 6px; } .chips.soltos button { border-radius: 3px; margin: 0; }
  .atalhos { margin-top: 14px; } .atalhos button { padding: 6px 12px; min-height: 36px; white-space: nowrap; }
  .ano-fixo { display: flex; align-items: baseline; gap: 12px; font-size: 12.5px; color: var(--muted); }
  .ano-fixo output { font: 500 28px/1 var(--serif); color: var(--ink); }
  .aviso-ano { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid var(--ochre); font-size: 13.5px; color: var(--ink-2); max-width: 68ch; }
  .leg { font-size: 12.5px; color: var(--ink-2); display: grid; gap: 5px; }
  .leg .grad { height: 8px; border-radius: 1px; max-width: 420px; }
  .leg .ext { display: flex; justify-content: space-between; color: var(--muted); max-width: 420px; }
  .leg .cats { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .leg i { display: inline-block; width: 11px; height: 11px; border-radius: 1px; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px var(--rule-2); }
  .leg .aviso { color: var(--warn); }
  .leg .ref-br { color: var(--muted); }

  /* coluna de leitura */
  .lado-texto { background: var(--bg); overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .sec { padding: 26px 40px; border-bottom: 1px solid var(--rule); }
  .sec:last-child { border-bottom: 0; }
  .sec h1, .sec h2 { font: 500 38px/1.08 var(--serif); margin: 10px 0 10px; letter-spacing: -.018em; text-wrap: balance; }
  .sec h1 { font-size: 46px; letter-spacing: -.024em; max-width: 16ch; }
  .sec h3 { font: 500 22px/1.25 var(--serif); margin: 0 0 8px; letter-spacing: -.008em; text-wrap: balance; }
  .lead { color: var(--ink-2); font-size: 17px; line-height: 1.5; margin: 0; max-width: 60ch; }
  .meta { margin: 14px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 0; }
  .meta span + span::before { content: "·"; margin: 0 8px; }
  .fonte { font-size: 12.5px; color: var(--muted); margin: 2px 0 14px; }
  .fonte a { color: inherit; }
  .nota { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 68ch; }
  /* faixa de indicadores: números separados por linhas finas, sem caixa por número */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); margin: 14px 0 4px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .kpi { padding: 12px 16px 13px; min-width: 0; border-left: 1px solid var(--rule); }
  .kpi:first-child { border-left: 0; padding-left: 0; }
  .kpi span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
  .kpi b { display: block; margin-top: 4px; font: 500 24px/1.15 var(--serif); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
  .kpi small { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
  .resumo-txt { margin: 0; font-size: 16.5px; line-height: 1.6; max-width: 64ch; }
  .resumo-txt + .resumo-txt { margin-top: 8px; }
  .resumo-txt b { font-weight: 600; }

  /* entrada: uma exploração principal, duas secundárias, outras perguntas */
  .abertura { padding-top: 34px; padding-bottom: 30px; }
  .destaques { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .destaque { padding: 24px 0 26px; min-width: 0; }
  .destaque.principal { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 6px 32px; align-items: start; border-bottom: 1px solid var(--rule); padding-top: 4px; }
  .destaque.principal > .kicker, .destaque.principal > h4 { grid-column: 1 / -1; }
  .destaque.principal > h4 { max-width: 30ch; margin-bottom: 10px; }
  .destaque.principal .pr-texto { padding-top: 6px; }
  .destaque.lado { padding-right: 24px; }
  .destaque.lado + .destaque.lado { padding: 24px 0 26px 24px; border-left: 1px solid var(--rule); }
  .destaque h4 { margin: 6px 0 8px; font: 500 22px/1.22 var(--serif); letter-spacing: -.01em; text-wrap: balance; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .destaque.principal h4 { font-size: 34px; line-height: 1.1; letter-spacing: -.02em; }
  .destaque p { margin: 0 0 14px; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
  .destaque .grafico { height: 190px; }
  .destaque.principal .grafico { height: 250px; }
  .mini-barras { list-style: none; margin: 4px 0 16px; padding: 0; }
  .mini-barras li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .mini-barras .trilho { grid-column: 2 / -1; height: 4px; background: var(--hover); }
  .mini-barras .trilho i { display: block; height: 100%; background: var(--ochre); }
  .outras-lista { list-style: none; margin: 4px 0 0; padding: 0; columns: 2 280px; column-gap: 32px; }
  .outras-lista li { break-inside: avoid; border-top: 1px solid var(--rule); }
  .outras-lista button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; padding: 10px 0; border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--ink); }
  .outras-lista button::after { content: "→"; margin-left: auto; color: var(--muted); transition: transform .15s; }
  .outras-lista button:hover { color: var(--accent-ink); } .outras-lista button:hover::after { color: var(--accent-ink); transform: translateX(2px); }
  .titulo-sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* rankings: linhas compactas, valores alinhados, barras discretas */
  .rank { list-style: none; margin: 6px 0 0; padding: 0; }
  .rank li { border-bottom: 1px solid var(--rule); }
  .rank li.atual { background: var(--sel-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .rank button { width: 100%; display: grid; grid-template-columns: 30px 20px minmax(0, 1fr) minmax(48px, 22%) minmax(92px, auto); gap: 10px; align-items: center; padding: 9px 4px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 14.5px; min-height: 44px; }
  .rank button:hover { background: var(--hover); }
  .rank button:hover .nome { text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
  .rank .pos { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .rank .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .val { text-align: right; white-space: nowrap; color: var(--ink); }
  .rank .val small { display: block; color: var(--muted); font-size: 12px; }
  .rank .tr { height: 6px; background: var(--hover); position: relative; }
  .rank .tr i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); opacity: .85; }
  .rank.imp .tr i { background: var(--ochre); }
  .rank .tr.div::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--rule-2); }
  .rank .tr.div i { left: 50%; } .rank .tr.div i.neg { left: auto; right: 50%; background: var(--neg); }
  .rank .sem .val { color: var(--muted); }
  .escala-nota { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .botoes { display: flex; gap: 8px 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { padding: 8px 14px; border-radius: 3px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; color: var(--ink); min-height: 38px; }
  .btn:hover { border-color: var(--ink-2); background: var(--hover); }
  .btn.pri { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 500; }
  .btn.pri:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

  /* abertura do país */
  .pais-cab { padding: 28px 40px 22px; border-bottom: 1px solid var(--rule); position: relative; }
  .pais-cab h2 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 500 44px/1.05 var(--serif); letter-spacing: -.022em; margin: 10px 56px 8px 0; }
  .pais-cab .ref { font-size: 14px; color: var(--ink-2); margin-bottom: 14px; }
  .pais-cab .ref b { color: var(--ink); font-weight: 600; }
  .tag { font: 600 10.5px/1.7 var(--sans); letter-spacing: .07em; text-transform: uppercase; padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 2px; color: var(--muted); vertical-align: middle; }
  .fechar { position: absolute; top: 24px; right: 32px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; color: var(--ink-2); font-size: 15px; }
  .fechar:hover { color: var(--ink); border-color: var(--ink-2); }
  .abas { display: flex; gap: 28px; padding: 0 40px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 4; background: var(--bg); }
  .abas button { border: 0; background: transparent; padding: 14px 0 12px; cursor: pointer; color: var(--ink-2); font: 500 17px/1.2 var(--serif); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button:hover { color: var(--ink); }
  .abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .grafico { width: 100%; height: 250px; }
  .grafico.baixo { height: 150px; }
  details.dados { margin-top: 10px; font-size: 13px; }
  details.dados summary, details.sobre summary, details.det summary, details.ficha summary { cursor: pointer; width: max-content; max-width: 100%; }
  details.dados summary { color: var(--ink-2); }
  details.dados table { border-collapse: collapse; margin-top: 8px; width: 100%; }
  details.dados th, details.dados td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); }
  details.dados th { font-weight: 600; color: var(--ink-2); }
  details.dados th:first-child, details.dados td:first-child { text-align: left; }
  /* listas de produtos: nome curto, valor, participação, barra; SH4 em segundo plano */
  .barras { list-style: none; margin: 6px 0 0; padding: 0; }
  .barras li { padding: 9px 0 10px; border-bottom: 1px solid var(--rule); }

<body>
<header class="barra">
  <a class="marca" href="./" title="Início do atlas">rotzx</a>
  <p class="marca-desc">Como o Brasil se conecta ao mundo</p>
  <nav class="nav" aria-label="Seções do atlas">
    <button type="button" data-nav="inicio">Início</button>
    <button type="button" data-nav="ranking">Parceiros</button>
    <button type="button" data-nav="produto">Produtos</button>
    <button type="button" data-nav="comparar">Comparar</button>
  </nav>
  <div class="ac" id="acTopo">
    <label class="sr" for="busca">Buscar país ou território</label>
    <input id="busca" type="search" placeholder="Buscar país ou território…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="buscaLista" aria-autocomplete="list">

  </div>
  <button class="fontes-link" type="button" id="abrirFontes">Fontes e método</button>

</header>

<main class="quadro">

        <button type="button" data-modo="lista" aria-pressed="false">Lista</button>

    </div>
    <div class="area">
      <div id="globo" role="img" aria-label="Globo: países coloridos pela métrica escolhida. A mesma informação está na lista e nos rankings."></div>
      <div class="lista" id="lista" aria-label="Lista de países e territórios"></div>
      <div class="zoom"><button type="button" id="mais" aria-label="Aproximar o globo">+</button><button type="button" id="menos" aria-label="Afastar o globo">−</button></div>
    </div>
    <div class="controles" id="controles" aria-label="Métrica e ano"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="dados/historia.js"></script>
<script>
"use strict";
// =====================================================================================================================
// rotzx — atlas das relações comerciais do Brasil (D47).
// Pergunta-guia: de quem o Brasil depende para vender e para comprar — e como isso mudou ao longo do tempo?
// Só dados medidos, com fonte e ano. Dado ausente ≠ zero. Participações sempre com o denominador dito na tela.
// =====================================================================================================================
const H = window.HISTORIA;
let P = window.PRODUTOS || null;           // explorador por produto: carregado sob demanda (dados/produtos.js)
const C = H.comercio, BR = "076";
const IDS = Object.keys(H.paises).filter((id) => id !== BR);
const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// ---------- tema e cores (D49): tudo vem dos tokens do CSS; globo e gráficos se redesenham quando o tema muda ----------
const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hexRgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mistura(a, b, t) { const x = hexRgb(a), y = hexRgb(b), k = Math.max(0, Math.min(1, t)); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join(""); }
let PAL = {};
function lerPaleta() {
  const escuro = tok("color-scheme") === "dark";
  PAL = { escuro, ink: tok("--ink"), ink2: tok("--ink-2"), muted: tok("--muted"), rule: tok("--rule"), rule2: tok("--rule-2"), bg: tok("--bg"), surface: tok("--surface"),
    exp: tok("--accent"), imp: tok("--ochre"), neg: tok("--neg"),
    oceano: escuro ? "#18201E" : "#D3DCDA", terra: escuro ? "#2A302B" : "#EFEBE2", br: escuro ? "#56604F" : "#B9B2A2",
    rampa: { exp: escuro ? ["#2F4636", "#B9E0C8"] : ["#D3E0CC", "#1E3A2A"], imp: escuro ? ["#4A3A26", "#F0C68E"] : ["#EEDBBB", "#74491A"],
             neg: escuro ? ["#4A302A", "#F2AC98"] : ["#F0D9D0", "#86331F"], onu: escuro ? ["#2A3540", "#AFD0E4"] : ["#DDE5EA", "#284A60"] },
    guerra: escuro ? "#E58C75" : "#93402F", conflito: escuro ? "#9C5E4B" : "#DDA592" };
}
const TEMAS = ["auto", "light", "dark"], ROT_TEMA = { auto: "automático", light: "claro", dark: "escuro" };
function temaAtual() { try { return localStorage.getItem("rotzx-tema") || "auto"; } catch { return "auto"; } }
function aplicarTema(t) {
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { if (t === "auto") localStorage.removeItem("rotzx-tema"); else localStorage.setItem("rotzx-tema", t); } catch { /* só nesta visita */ }
  const b = $("#tema"), I = { auto: '<path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/>',
    light: '<circle cx="12" cy="12" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    dark: '<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' };
  b.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">${I[t]}</svg>`;
  b.setAttribute("aria-label", `Tema ${ROT_TEMA[t]}. Trocar o tema`); b.title = `Tema ${ROT_TEMA[t]} (clique para trocar)`;
  lerPaleta();
}
aplicarTema(temaAtual());

// ---------- formatos ----------
const nf = (v, c) => v.toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
function usd(v) {                     // escala adaptada à grandeza; null = sem dado (nunca "US$ 0,0 bi")
  if (v == null) return "sem dado";
  if (v === 0) return "US$ 0";
  const a = Math.abs(v), s = v < 0 ? "−" : "";
  if (a >= 1e12) return `${s}US$ ${nf(a / 1e12, 2)} tri`;
  if (a >= 1e9) return `${s}US$ ${nf(a / 1e9, a >= 1e11 ? 0 : 1)} bi`;
  if (a >= 1e6) return `${s}US$ ${nf(a / 1e6, a >= 1e8 ? 0 : 1)} mi`;
  if (a >= 1e3) return `${s}US$ ${nf(a / 1e3, 0)} mil`;
  return `${s}US$ ${nf(a, 0)}`;
}
function pct(x, c = 1) {              // x em fração (0,25 = 25%); muito pequeno não vira "0,0%"
  if (x == null) return "sem dado";
  if (x === 0) return "0%";
  if (Math.abs(x) < 0.0005) return x > 0 ? "menos de 0,1%" : "−menos de 0,1%";
  return nf(x * 100, c) + "%";
}
const usdR = (v) => (v == null ? "sem registro" : usd(v));
const parteR = (t, k) => (t?.[k] == null ? "sem registro" : pct(t[k === "e" ? "pe" : "pi"]));      // participação só quando o fluxo existe
const pp = (d) => (d == null ? "sem dado" : (d >= 0 ? "+" : "−") + nf(Math.abs(d * 100), 1) + " p.p.");
const ord = (n) => `${n}º`, ordF = (n) => `${n}ª`;   // "9º destino", "12ª origem"
const juntarE = (l) => (l.length < 2 ? l.join("") : l.slice(0, -1).join(", ") + " e " + l[l.length - 1]);   // "a, b e c"
const quando = (iso) => (iso ? new Date(iso).toLocaleDateString("pt-BR") : "");

// ---------- países, territórios e bandeiras ----------
const nome = (id) => H.paises[id]?.nome || id;
const ehTerritorio = (id) => H.paises[id]?.tipo === "territorio";
const FLAGS = "https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/flags/4x3/";   // flag-icons (MIT): bandeira atual, não a do ano
function bandeira(id, { grande = false, alt = "" } = {}) {
  const iso2 = (H.paises[id]?.iso2 || "").toLowerCase();
  const cls = "flag" + (grande ? " g" : "");
  if (!iso2) return `<span class="${cls} vazia" aria-hidden="true"></span>`;
  return `<img class="${cls}" src="${FLAGS}${iso2}.svg" width="${grande ? 36 : 20}" height="${grande ? 27 : 15}" alt="${esc(alt)}"${alt ? "" : ' aria-hidden="true"'} loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'${cls} vazia'}))">`;
}

// ---------- séries ----------
const ini = C.inicio, fim = C.fim;
const em = (serie, a, inicio = ini) => (serie && a >= inicio && a - inicio < serie.length ? serie[a - inicio] : null);
const brE = (a) => em(C.brasil.e, a), brI = (a) => em(C.brasil.i, a);
function trocas(id, a) {              // null = sem registro no Comex Stat naquele ano (o Comex só lista fluxos positivos)
  const d = C.paises[id]; if (!d || a < ini || a > fim) return null;
  const e = em(d.e, a), i = em(d.i, a);
  if (e == null && i == null) return null;
  return { e, i, t: (e || 0) + (i || 0), s: (e || 0) - (i || 0), pe: e != null ? e / brE(a) : 0, pi: i != null ? i / brI(a) : 0,
           pt: ((e || 0) + (i || 0)) / (brE(a) + brI(a)) };
}

// ---------- métricas do mapa e dos rankings ----------
const MET = {
  exp: { rot: "Exportações", cab: "Para onde vão as exportações", desc: "exportações do Brasil para o país (US$ FOB correntes)",
         den: "participação = exportações para o país ÷ total exportado pelo Brasil no ano", v: (t) => t?.e ?? null, p: (t) => t?.pe, tipo: "usd" },
  imp: { rot: "Importações", cab: "De onde vêm as importações", desc: "importações do Brasil com origem no país (US$ FOB correntes)",
         den: "participação = importações do país ÷ total importado pelo Brasil no ano", v: (t) => t?.i ?? null, p: (t) => t?.pi, tipo: "usd" },
  corrente: { rot: "Corrente", cab: "Maiores parceiros", desc: "corrente de comércio: exportações + importações (US$ FOB correntes)",
         den: "participação = corrente com o país ÷ corrente total do Brasil no ano", v: (t) => t?.t ?? null, p: (t) => t?.pt, tipo: "usd" },
  part: { rot: "Participação", cab: "Peso de cada parceiro", desc: "participação do parceiro na corrente de comércio do Brasil (%)",
         den: "corrente com o país ÷ corrente total do Brasil (exportações + importações) no ano", v: (t) => t?.pt ?? null, tipo: "pct" },
  mud: { rot: "Mudança", cab: "Quem ganhou e quem perdeu importância", desc: "variação da participação na corrente de comércio entre dois anos, em pontos percentuais",

// barra da análise: onde estou, ano e espaço de leitura (fica no fluxo da página, não sobre o conteúdo)

function seletorAno() {

function concentracao(k, a) {          // parte do maior e dos 5 maiores parceiros no total do Brasil (denominador: total do Brasil)

  const r = IDS.map((id) => [id, em(C.paises[id]?.[k], a)]).filter(([, v]) => v).sort((x, y) => y[1] - x[1]);
  return { n: r.length, top: r[0], p1: r[0][1] / tot, p5: r.slice(0, 5).reduce((s, [, v]) => s + v, 0) / tot };
}

function listaRank(r, m, a, { total = null, nota = true } = {}) {

    const atual = id === st.pais || (!st.pais && st.vista === "comparar" && (id === st.a || id === st.b));
    const w = ((Math.abs(v) / max) * (div ? 50 : 100)).toFixed(2);
    return `<li${atual ? ' class="atual"' : ""}><button type="button" data-pais="${id}"${atual ? ' aria-current="true"' : ""}><span class="pos">${(total ? total[k] : k + 1)}º</span>${bandeira(id)}<span class="nome">${esc(nome(id))}${ehTerritorio(id) ? ' <span class="tag">território</span>' : ""}</span>

  }).join("")}</ol>${nota && r.length > 1 ? `<p class="escala-nota">${div ? "Barras a partir do centro: à direita, ganho de participação; à esquerda, perda (p.p.)." : "Barras proporcionais ao maior valor desta lista."}</p>` : ""}`;

// ---------- busca (bandeira + nome; teclado: ↑ ↓ Enter Esc) ----------
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function buscarPais(q) {
  const n = norm(q.trim()); if (!n) return [];
  return Object.keys(H.paises).filter((id) => norm(nome(id)).includes(n) || H.paises[id].iso3.toLowerCase() === n)
    .sort((a, b) => (norm(nome(a)).startsWith(n) ? 0 : 1) - (norm(nome(b)).startsWith(n) ? 0 : 1) || nome(a).localeCompare(nome(b))).slice(0, 12)
    .map((id) => ({ v: id, html: `${bandeira(id)}<span>${esc(nome(id))}</span>${ehTerritorio(id) ? "<small>território</small>" : ""}` }));
}
function buscarProduto(q) {
  const n = norm(q.trim()); if (!n || !P) return [];
  return Object.entries(P.itens).filter(([c, x]) => norm(x.nome).includes(n) || norm(x.oficial).includes(n) || c === n)
    .sort((a, b) => (a[0].startsWith("g-") ? 0 : 1) - (b[0].startsWith("g-") ? 0 : 1) || (norm(a[1].nome).startsWith(n) ? 0 : 1) - (norm(b[1].nome).startsWith(n) ? 0 : 1)).slice(0, 12)
    .map(([c, x]) => ({ v: c, html: `<span>${esc(x.nome)}</span><small>${c.startsWith("g-") ? "grupo" : "SH4 " + c}</small>` }));

function autocompletar(inp, lista, fonte, escolher) {
  let itens = [], sel = -1;
  const fechar = () => { lista.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant"); sel = -1; };
  const mostrar = () => {
    itens = fonte(inp.value);
    if (!itens.length) return fechar();
    lista.innerHTML = itens.map((x, i) => `<li role="option" id="${lista.id}-${i}" aria-selected="${i === sel}" data-i="${i}">${x.html}</li>`).join("");
    lista.hidden = false; inp.setAttribute("aria-expanded", "true");
    if (sel >= 0) inp.setAttribute("aria-activedescendant", `${lista.id}-${sel}`);
  };
  inp.oninput = () => { sel = -1; mostrar(); };
  inp.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (lista.hidden) mostrar(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + itens.length) % itens.length; mostrar(); }
    else if (e.key === "Enter") { e.preventDefault(); const x = itens[sel >= 0 ? sel : 0]; if (x) { fechar(); escolher(x.v); inp.blur(); } }
    else if (e.key === "Escape") fechar();
  };
  lista.onmousedown = (e) => { const li = e.target.closest("li"); if (!li) return; e.preventDefault(); const x = itens[+li.dataset.i]; fechar(); escolher(x.v); };
  inp.onblur = () => setTimeout(fechar, 120);
}

// ---------- gráficos (ECharts) ----------

const eixoX = (a0, a1) => ({ type: "category", data: Array.from({ length: a1 - a0 + 1 }, (_, i) => String(a0 + i)),

function pico(serie, a0) { let k = -1; (serie || []).forEach((v, j) => { if (v != null && (k < 0 || v > serie[k])) k = j; }); return k < 0 ? null : { ano: a0 + k, v: serie[k] }; }

    ...(marcaL ? { markLine: marcaL } : {}), ...(pontos ? { markPoint: pontos } : {}) };
}
const dica = (fmt) => ({ trigger: "axis", backgroundColor: PAL.surface, borderColor: PAL.rule2, textStyle: { color: PAL.ink, fontSize: 12.5 },
  axisPointer: { lineStyle: { color: PAL.rule2 } }, valueFormatter: (v) => (v == null ? "sem registro" : fmt(v)) });

        { ...linha("Mediana dos países", H.onu.mediana, PAL.muted, { curto: "Mediana", larg: 1.2 }), symbol: "none", lineStyle: { type: "dotted", color: PAL.muted, width: 1.2 } }] });

      novo("#gConf", { grid: { left: 112, right: 14, top: 22, bottom: 26 }, tooltip: { trigger: "item", backgroundColor: PAL.surface, borderColor: PAL.rule2, textStyle: { color: PAL.ink }, formatter: (p) => `${p.name}: ${p.seriesName}` }, xAxis: eixoX(H.conflitos.inicio, H.conflitos.fim),
        yAxis: { type: "category", data: ["Com tropas", "Como lado", "No território"], axisLabel: { color: PAL.ink2 }, axisLine: { show: false }, axisTick: { show: false } },

// ---------- globo ----------
// Aparência cartográfica (D49): oceano liso e claro, terra neutra para "sem registro", contornos finos,
// país selecionado em tinta escura e mais alto, Brasil em cinza com contorno (é o ponto de vista, não um parceiro).
let globo = null, poligonos = [], sobre = null;
function corPol(f) {
  if (f.id === st.pais) return PAL.ink;
  const c = f.id === BR ? PAL.br : corDe(f.id);
  return f === sobre ? mistura(c, PAL.ink, 0.25) : c;
}
const contorno = (f) => (f.id === st.pais ? PAL.ink : f.id === BR ? PAL.ink2 : PAL.escuro ? "rgba(233,230,222,.24)" : "rgba(34,39,33,.28)");
const ladoPol = (f) => (f.id === st.pais ? PAL.ink : "rgba(0,0,0,0)");
const altPol = (f) => (f.id === st.pais ? 0.03 : (!st.pais && st.vista === "comparar" && (f.id === st.a || f.id === st.b)) ? 0.018 : 0.006);
function pintarGlobo() { if (globo) globo.polygonCapColor(corPol).polygonStrokeColor(contorno).polygonSideColor(ladoPol).polygonAltitude(altPol); }
function centro(f) {
  const g = f.geometry; if (!g) return null;
  const aneis = g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map((p) => p[0]);
  const maior = aneis.sort((a, b) => b.length - a.length)[0];
  const lngs = maior.map((c) => c[0]), lats = maior.map((c) => c[1]);
  const span = Math.max(Math.max(...lngs) - Math.min(...lngs), Math.max(...lats) - Math.min(...lats));
  return { lat: lats.reduce((s, x) => s + x, 0) / lats.length, lng: lngs.reduce((s, x) => s + x, 0) / lngs.length, altitude: Math.min(2.4, Math.max(0.55, span / 26)) };
}
function enquadrar() {
  if (!globo) return;
  const f = st.pais && poligonos.find((p) => p.id === st.pais);
  const alvo = f ? centro(f) : st.pais ? null : { lat: -12, lng: -45, altitude: 2.35 };
  globo.controls().autoRotate = !st.pais && !reduzir;
  if (alvo) globo.pointOfView(alvo, reduzir ? 0 : 1100);
}
function tingir() {                    // oceano em cor lisa, sem textura nem brilho
  if (!globo) return;
  const mat = globo.globeMaterial();
  mat.shininess = 0; if (mat.specular) mat.specular.set("#000000");
  mat.color.set("#000000");
  if (mat.emissive) { mat.emissive.set(PAL.oceano); mat.emissiveIntensity = 1; } else mat.color.set(PAL.oceano);
  mat.needsUpdate = true;
}
function iniciarGlobo(atlas) {
  poligonos = topojson.feature(atlas, atlas.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const el = $("#globo");
  globo = Globe()(el)
    .backgroundColor("rgba(0,0,0,0)").showGraticules(true).showAtmosphere(false)
    .polygonsData(poligonos).polygonCapColor(corPol).polygonSideColor(ladoPol).polygonStrokeColor(contorno)
    .polygonAltitude(altPol).polygonsTransitionDuration(reduzir ? 0 : 200)
    .polygonLabel((f) => { const id = f.id; if (!H.paises[id]) return `<div class="tip"><b>${esc(f.properties.name)}</b><span>sem dados na base</span></div>`;
      const v = id === BR ? null : valor(id), p = id === BR ? null : posicao(id);
      return `<div class="tip">${bandeira(id)} <b>${esc(nome(id))}</b><span>${id === BR ? "ponto de referência da análise" : `${esc(MET[st.m].rot)} em ${st.ano}: ${esc(fmtValor(v))}${p ? ` · ${ord(p[0])} de ${p[1]}` : ""}`}</span></div>`; })
    .onPolygonHover((f) => { sobre = f; globo.polygonCapColor(corPol); el.style.cursor = f ? "pointer" : "grab"; })
    .onPolygonClick((f) => { if (H.paises[f.id]) abrirPais(f.id); });
  tingir();
  globo.controls().autoRotateSpeed = 0.18;
  const ajustar = () => globo.width(el.clientWidth).height(el.clientHeight);
  addEventListener("resize", ajustar); if (window.ResizeObserver) new ResizeObserver(ajustar).observe(el); ajustar();
  enquadrar();
}
$("#mais").onclick = () => { if (!globo) return; const v = globo.pointOfView(); globo.controls().autoRotate = false; globo.pointOfView({ ...v, altitude: Math.max(0.25, v.altitude * 0.75) }, 300); };
$("#menos").onclick = () => { if (!globo) return; const v = globo.pointOfView(); globo.pointOfView({ ...v, altitude: Math.min(4, v.altitude * 1.33) }, 300); };

// ---------- partida ----------
autocompletar($("#busca"), $("#buscaLista"), buscarPais, (id) => { $("#busca").value = ""; abrirPaisGeral(id); });
Object.assign(st, lerURL());

(async () => {
  try {
    if (typeof Globe !== "function") throw new Error("globe.gl não carregou");
    const t = document.createElement("canvas"); if (!(t.getContext("webgl2") || t.getContext("webgl"))) throw new Error("sem WebGL");
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");

  }
})();
